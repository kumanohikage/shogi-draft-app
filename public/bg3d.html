<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>背景 3D</title>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  /* 奥の色(テーマごと)。自分の背景画像の上に重ねるとき(over)は透明 */
  #back { position: absolute; inset: 0; }
  body.over #back { display: none; }
  body[data-theme="sports"] #back { background: radial-gradient(ellipse 80% 70% at 50% 42%, #1b3f8f 0%, #0d1e4a 45%, #050b1f 100%); }
  body[data-theme="draft"] #back { background: radial-gradient(ellipse 90% 80% at 50% 35%, #ffffff 0%, #eef0f4 50%, #d7dce5 100%); }
  body[data-theme="sakura"] #back { background: linear-gradient(180deg, #fde9ef 0%, #fff6f8 55%, #fbe3ea 100%); }
  body[data-theme="title"] #back { background: radial-gradient(ellipse 85% 75% at 50% 40%, #2a1d2e 0%, #160f1a 50%, #08060a 100%); }
</style>
</head>
<body>
<div id="back"></div>
<canvas id="c"></canvas>
<script type="module" src="bg3d.js"></script>
</body>
</html>
