<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くじの演出チェック</title>
<link href="vendor/fonts/noto-sans-jp/font.css" rel="stylesheet">
<style>
  :root { --bg: #14100c; --surface: #221a13; --line: #4a3a2a; --ink: #f5ead8; --mute: #b8a68c; --gold: #f0b54a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 'Noto Sans JP', sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 12px 0 0; font-size: 18px; color: var(--gold); }
  label { display: inline-flex; align-items: center; gap: 6px; color: var(--mute); font-size: 13px; }
  select, button { font: inherit; height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  button.main { background: var(--gold); color: #1a1205; border-color: var(--gold); font-weight: 700; min-width: 160px; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #state { margin-left: auto; color: var(--mute); font-size: 13px; }
  .stage { position: relative; width: min(100vw - 32px, (100vh - 150px) * 16 / 9); aspect-ratio: 16 / 9; margin: 16px auto; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #000; }
  .stage iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; }
  .lots { display: flex; flex-wrap: wrap; gap: 8px; }
  .lots button { display: inline-flex; align-items: center; gap: 8px; }
  .lots i { width: 18px; height: 18px; border-radius: 5px; display: inline-block; }
  footer { padding: 0 16px 16px; color: var(--mute); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>くじの演出チェック</h1>
  <label>方式 <select id="mode"><option value="envelope">封筒（3D）</option><option value="amida">あみだくじ（3D）</option><option value="wheel">色を選んでルーレット</option></select></label>
  <label>競合チーム数 <select id="n"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>8</option><option>12</option></select></label>
  <button type="button" id="reset">最初から</button>
  <label><input type="checkbox" id="sound"> 音を出す</label>
  <span id="state"></span>
</header>
<header>
  <div class="lots" id="lots"></div>
  <button type="button" id="auto">残りを自動で選ぶ</button>
  <button type="button" class="main" id="open">開ける</button>
</header>
<div class="stage" id="stage"><iframe id="f" src="lots3d.html" title="くじの3D演出"></iframe><iframe id="r" src="roulette.html?layout=horizontal" title="ルーレット" style="visibility:hidden"></iframe></div>
<footer>本番とは別の、演出を確かめるための画面です。ルーレットは「色を選んでルーレット」で見られます。アプリの抽選のしくみ（当たりを先に決めて隠す・選んだくじで決まる）をそのまま使っています。結果は「最初から」のたびに変わります。</footer>
<script src="core.js"></script>
<script src="overlay-audio.js"></script>
<script>
// アプリの抽選のしくみ(core.js)をこの画面の中だけで動かし、3D の画面へ配信画面と同じ形で状態を送る
const C = window.DraftCore, { SE } = window.OverlayAudio;
const $ = (id) => document.getElementById(id);
const NAMES = ['飛鳥', '角田', '金森', '銀河', '桂', '香月', '王寺', '歩坂', '香川', '桂木', '銀山', '金田'];
let S = null, ready = false, busyUntil = 0, rReady = false, spinning = false;
const wheel = () => S && S.lottery.mode === 'wheel';
function reset() {
  const n = +$('n').value, mode = $('mode').value;
  S = C.apply(C.initialState(), { type: 'replaceRoster', leaders: NAMES.slice(0, n).map((x) => ({ name: x + ' リーダー', short: x })), players: [{ name: '香川 あおい' }, { name: 'ダミー' }] });
  S = C.apply(S, { type: 'setOption', patch: { lotteryMode: mode, lotFx: '3d' } });
  for (const l of S.leaders) S = C.apply(S, { type: 'nominate', leaderId: l.id, playerId: S.players[0].id });
  S = C.apply(S, { type: 'reveal' });
  S = C.apply(S, { type: 'drawLottery', playerId: S.players[0].id }, Math.random);
  busyUntil = 0; spinning = false;
  $('f').style.visibility = mode === 'wheel' ? 'hidden' : ''; $('r').style.visibility = mode === 'wheel' ? '' : 'hidden';
  if (mode === 'wheel' && rReady) $('r').contentWindow.postMessage({ type: 'reset' }, '*');
  send(); render();
}
function team(id) { const l = C.leaderById(S, id); return l ? C.teamLabel(S, l) : ''; }
function note(L) {
  const who = L.leaders.find((id) => L.picks[id] == null);
  const verb = L.mode === 'amida' ? 'あみだくじ' : '封筒';
  return L.phase === 'pick' ? `${team(who)} が${verb}を選んでいます` : L.phase === 'ready' ? `選んだ順に${L.mode === 'amida' ? 'たどります' : '開けます'}` : '';
}
// ルーレット: 配信画面と同じく、区切り=くじの色、当たり=winLot
function spin() {
  const L = S.lottery, owner = (i) => L.leaders.find((id) => L.picks[id] === i), f = $('r').contentWindow;
  f.postMessage({ type: 'setup', pick: '香川 あおい', image: '', leaders: L.lots.map((x, i) => `${x.label} ${team(owner(i))}`), colors: L.lots.map((x) => x.color) }, '*');
  setTimeout(() => f.postMessage({ type: 'spin', id: L.id, winner: L.winLot, plan: '' }, '*'), 700);
}
function send() {
  if (!ready || wheel()) return;
  const L = S.lottery, owner = (i) => L.leaders.find((id) => L.picks[id] === i);
  $('f').contentWindow.postMessage({ type: 'lots', data: { id: L.id, mode: L.mode, lots: L.lots, owners: L.lots.map((_, i) => (owner(i) ? team(owner(i)) : null)),
    order: L.leaders.map((id) => L.picks[id]), opened: L.opened, done: L.done, winLot: L.winLot, amida: L.amida, player: { name: '香川 あおい', icon: '' }, note: note(L) } }, '*');
}
function act(a) { try { S = C.apply(S, a); } catch (e) { $('state').textContent = e.message; return; } send(); render(); }
function render() {
  const L = S.lottery, taken = new Set(Object.values(L.picks)), who = L.leaders.find((id) => L.picks[id] == null);
  $('lots').innerHTML = L.phase === 'pick' ? L.lots.map((x, i) => `<button type="button" data-lot="${i}" ${taken.has(i) ? 'disabled' : ''}><i style="background:${x.color}"></i>${x.label}</button>`).join('') : '';
  $('auto').disabled = L.phase !== 'pick';
  const busy = Date.now() < busyUntil;
  $('open').disabled = L.phase === 'pick' || L.done || busy || spinning || (wheel() && L.phase !== 'ready');
  $('open').textContent = busy || spinning ? '演出中…' : L.done ? '決着' : wheel() ? 'ルーレットを回す' : `${L.mode === 'amida' ? 'たどる' : '開ける'}（${team(L.leaders[L.opened]) || '―'}）`;
  $('state').textContent = L.phase === 'pick' ? `${team(who)} の番（${L.leaders.indexOf(who) + 1} / ${L.leaders.length}）` : busy || spinning ? '演出中…（結果は演出のあとで）' : L.done ? `交渉権: ${team(L.winner)}` : `当たりのくじは決まっています（${L.opened} / ${L.leaders.length} 人開けた）`;
}
// 選ぶ: 最後の1人は少し間をあけて残り物(本番と同じ)
function pick(lot) {
  act({ type: 'lotPick', lot });
  const L = S.lottery, rest = L.leaders.filter((id) => L.picks[id] == null);
  if (L.phase === 'pick' && rest.length === 1) setTimeout(() => act({ type: 'lotPick', lot: L.lots.findIndex((_, i) => !Object.values(S.lottery.picks).includes(i)) }), 1400);
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-lot]'); if (b) pick(+b.dataset.lot);
});
$('auto').addEventListener('click', () => { const L = S.lottery; const free = L.lots.map((_, i) => i).filter((i) => !Object.values(L.picks).includes(i)); if (free.length) pick(free[Math.floor(Math.random() * free.length)]); });
$('open').addEventListener('click', () => {
  if (wheel()) { act({ type: 'lotSpin' }); spinning = true; render(); spin(); return; }
  act({ type: 'lotOpen' }); busyUntil = S.busyUntil || 0; render(); setTimeout(render, Math.max(0, busyUntil - Date.now()) + 50); });
$('reset').addEventListener('click', reset);
$('mode').addEventListener('change', reset); $('n').addEventListener('change', reset);
// 3D の画面の準備ができたら送る / 効果音
addEventListener('message', (e) => {
  const m = e.data || {};
  if (m.type === 'lots3d-ready') { ready = true; send(); }
  else if (m.type === 'roulette-ready') { rReady = true; vol(); }
  else if (m.type === 'roulette-done' && S && m.id === S.lottery.id) { spinning = false; act({ type: 'lotteryDone', id: m.id }); }
  else if (m.type === 'lots-sfx' && $('sound').checked && SE[m.name]) SE[m.name]();
});
// ルーレットは自前の音。チェックを外している間は無音
function vol() { const f = $('r').contentWindow; f.postMessage({ type: 'volume', v: $('sound').checked ? 1 : 0 }, '*'); f.postMessage({ type: 'silence', on: !$('sound').checked }, '*'); }
$('sound').addEventListener('change', () => { SE.setVolume($('sound').checked ? 0.7 : 0); vol(); });
// 1920×1080 の画面を枠に合わせて縮める
const fit = () => { for (const id of ['f', 'r']) $(id).style.transform = `scale(${$('stage').clientWidth / 1920})`; };
addEventListener('resize', fit); fit();
reset();
</script>
</body>
</html>
