<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>くじ 3D</title>
<link href="vendor/fonts/dela-gothic-one/font.css" rel="stylesheet">
<link href="vendor/fonts/noto-sans-jp/font.css" rel="stylesheet">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0703; }
  #c { display: block; width: 100%; height: 100%; }
  /* 1920×1080 の文字(画面の上にかぶせる。ルーレットと同じ作り) */
  #hud { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; pointer-events: none; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; --vw: 19.2px; --vh: 10.8px; --heavy: 'Dela Gothic One', sans-serif; }
  /* 結果: ルーレットと同じ「◯◯ 交渉権確定!」 */
  #result { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  #result.show { display: flex; }
  #result .rbg { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,40,0,.15), rgba(40,0,0,.55)); animation: fadeIn .4s both; }
  #result .who { position: relative; font: normal 120px/1.1 'Dela Gothic One', sans-serif; letter-spacing: .04em; white-space: nowrap;
    background: linear-gradient(180deg, #fff, #f4f4fa 45%, #b9b9cc); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 3px rgba(0,0,0,.65); filter: drop-shadow(0 0 22px rgba(255,255,255,.5)) drop-shadow(0 8px 0 rgba(0,0,0,.5)); animation: resIn .7s cubic-bezier(.2,1.6,.4,1) both; }
  #result .nm { position: relative; font: 900 44px 'Noto Sans JP'; letter-spacing: .3em; color: #fff3d6; text-shadow: 0 0 14px rgba(255,170,40,.8), 0 3px 0 rgba(0,0,0,.6); animation: fadeIn .4s both; }
  #result .ok { position: relative; font: normal 170px/1.1 'Dela Gothic One', sans-serif; letter-spacing: .04em; white-space: nowrap;
    background: linear-gradient(180deg, #fffbe0 0%, #ffe066 30%, #ff9d00 48%, #ff2020 52%, #9a0000 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 4px #3a0000; filter: drop-shadow(0 0 30px #ff5a00) drop-shadow(0 10px 0 rgba(0,0,0,.6)); animation: resInEnd 1s .15s cubic-bezier(.2,1.6,.4,1) both, resShake .12s linear 1.05s 6; }
  #result .shine { position: absolute; inset: 0; overflow: hidden; }
  #result .shine i { position: absolute; top: 0; bottom: 0; width: 18%; background: linear-gradient(105deg, transparent, rgba(255,255,255,.35) 50%, transparent); animation: shineMove 1.3s linear infinite; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes resIn { 0% { transform: scale(2.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes resInEnd { 0% { transform: scale(2.6) rotate(-8deg); opacity: 0; } 60% { transform: scale(.92) rotate(0); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes resShake { 25% { transform: translate(-6px, 3px); } 50% { transform: translate(5px, -4px); } 75% { transform: translate(-3px, -2px); } }
  @keyframes shineMove { from { transform: translateX(-120%); } to { transform: translateX(650%); } }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  /* 試作: 外れのスタンプ(その場所にドンと押す) */
  .stamp { position: absolute; transform: translate(-50%, -50%) rotate(-8deg); font: normal 92px/1 'Dela Gothic One', sans-serif; color: #f4efe6; padding: 10px 26px; border: 8px solid #f4efe6; border-radius: 18px;
    background: rgba(40,30,22,.55); text-shadow: 0 4px 0 rgba(0,0,0,.5); box-shadow: 0 0 0 4px rgba(0,0,0,.35); animation: stampIn .9s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes stampIn { 0% { transform: translate(-50%, -50%) rotate(-8deg) scale(2.6); opacity: 0; } 22% { transform: translate(-50%, -50%) rotate(-8deg) scale(.92); opacity: 1; } 32% { transform: translate(-50%, -50%) rotate(-8deg) scale(1); } 80% { opacity: 1; } 100% { transform: translate(-50%, -50%) rotate(-8deg) scale(1); opacity: 0; } }
  #flash.go { animation: flash var(--fd, .5s) ease-out; }
  @keyframes flash { 0% { opacity: var(--fo, .9); } 100% { opacity: 0; } }
  /* カットイン(ルーレットと同じ作り) */
  #fx { position: absolute; inset: 0; }
  .cutin { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .cutin .band { position: absolute; left: -10%; right: -10%; top: 50%; height: calc(36 * var(--vh)); margin-top: calc(-18 * var(--vh)); animation: band var(--d) both; background: var(--band);
    box-shadow: 0 0 40px var(--glow), inset 0 6px 0 rgba(255,255,255,.35), inset 0 -6px 0 rgba(0,0,0,.35); overflow: hidden; }
  .cutin .band::after { content: ''; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.55) 50%, transparent 60%); background-size: 250% 100%; animation: bandSweep 1.1s ease-in-out .15s both; }
  @keyframes bandSweep { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  .cutin .band::before { content: ''; position: absolute; left: 0; right: 0; top: 8px; bottom: 8px; border-top: 3px solid rgba(255,255,255,.55); border-bottom: 3px solid rgba(0,0,0,.3); }
  .cutin .band i { position: absolute; left: 0; height: 3px; border-radius: 3px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); animation: streak var(--sd) linear infinite; }
  @keyframes streak { from { transform: translateX(calc(-30 * var(--vw))); } to { transform: translateX(calc(130 * var(--vw))); } }
  .cutin.small .band { height: calc(18 * var(--vh)); margin-top: calc(-9 * var(--vh)); }
  .cutin .wrap { position: relative; animation: slam var(--d) both; text-align: center; }
  .cutin .main { font-family: var(--heavy); line-height: 1.05; letter-spacing: .04em; white-space: nowrap; font-size: min(calc(15 * var(--vw)), calc(21 * var(--vh)));
    background: var(--txt); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(2px 0 0 rgba(0,0,0,.6)) drop-shadow(-2px 0 0 rgba(0,0,0,.6)) drop-shadow(0 2px 0 rgba(0,0,0,.6)) drop-shadow(0 -2px 0 rgba(0,0,0,.6)) drop-shadow(0 0 18px var(--glow)) drop-shadow(0 6px 0 rgba(0,0,0,.5)); }
  .cutin.small .main { font-size: min(calc(8 * var(--vw)), calc(11 * var(--vh))); }
  .cutin .sub { font-family: var(--heavy); font-size: min(calc(6 * var(--vw)), calc(8 * var(--vh))); color: #fff; margin-top: .2em;
    filter: drop-shadow(2px 0 0 rgba(0,0,0,.7)) drop-shadow(-2px 0 0 rgba(0,0,0,.7)) drop-shadow(0 2px 0 rgba(0,0,0,.7)) drop-shadow(0 -2px 0 rgba(0,0,0,.7)) drop-shadow(0 0 12px var(--glow)); }
  .cutin.small .sub { font-size: calc(4.2 * var(--vw)); }
  @keyframes band { 0% { transform: skewY(-5deg) scaleY(0); opacity: 1; } 10% { transform: skewY(-5deg) scaleY(1.15); } 16% { transform: skewY(-5deg) scaleY(1); } 84% { transform: skewY(-5deg) scaleY(1); opacity: 1; } 100% { transform: skewY(-5deg) scaleY(0); opacity: 0; } }
  @keyframes slam { 0% { transform: scale(3.2) rotate(-6deg); opacity: 0; } 13% { transform: scale(.9) rotate(0); opacity: 1; } 19% { transform: scale(1.06); } 25% { transform: scale(1); } 84% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
  .t-blue   { --band: linear-gradient(180deg,#1d64ff,#062a8f); --txt: linear-gradient(180deg,#fff,#a8d6ff 45%,#2e86ff 55%,#0b3fb0); --glow: #3aa0ff; }
  .t-green  { --band: linear-gradient(180deg,#14d36b,#03642d); --txt: linear-gradient(180deg,#fff,#b6ffd0 45%,#1fd86f 55%,#05722f); --glow: #22e57a; }
  .t-red    { --band: linear-gradient(180deg,#ff2b2b,#7a0000); --txt: linear-gradient(180deg,#fff,#ffd1d1 40%,#ff3030 55%,#8a0000); --glow: #ff2a2a; }
  .t-gold   { --band: linear-gradient(180deg,#ffe066,#a86400); --txt: linear-gradient(180deg,#fffbe0,#ffe066 40%,#e09b00 56%,#7a4200); --glow: #ffcc33; }
  .t-zebra  { --band: repeating-linear-gradient(115deg,#0a0a0a 0 26px,#f4f4f4 26px 52px); --txt: linear-gradient(180deg,#fffbe0,#ffe066 40%,#e09b00 56%,#7a4200); --glow: #fff; }
  .t-rainbow{ --band: linear-gradient(90deg,#ff2a2a,#ffb800,#3dff5a,#22c6ff,#7a5cff,#ff3df2,#ff2a2a); --txt: linear-gradient(90deg,#ff4d4d,#ffd84d,#5dff7a,#4dd8ff,#9a7aff,#ff6df5,#ff4d4d); --glow: #fff; }
  .t-rainbow .band { background-size: 200% 100%; animation: band var(--d) both, rb 1s linear infinite; }
  .t-rainbow .main { animation: rb 1s linear infinite; }
  @keyframes rb { to { background-position: 200% 0; } }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hud">
  <div id="fx"></div>
  <div id="flash"></div>
  <div id="result"><div class="rbg"></div><div class="nm" id="result-nm"></div><div class="who" id="result-who"></div><div class="ok">交渉権確定!</div><div class="shine"><i></i></div></div>
</div>
<script type="module" src="lots3d.js"></script>
</body>
</html>
