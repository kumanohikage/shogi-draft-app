<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>くじ 3D</title>
<link href="vendor/fonts/dela-gothic-one/font.css" rel="stylesheet">
<link href="vendor/fonts/noto-sans-jp/font.css" rel="stylesheet">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0705; }
  #c { display: block; width: 100%; height: 100%; }
  /* 1920×1080 の文字(画面の上にかぶせる) */
  #hud { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; pointer-events: none; font-family: 'Noto Sans JP', sans-serif; }
  .head { position: absolute; left: 0; right: 0; top: 34px; display: flex; align-items: center; justify-content: center; gap: 24px; }
  .head img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 5px solid #fff; box-shadow: 0 0 30px rgba(255,210,120,.6); }
  .head .pn { font: normal 64px 'Dela Gothic One', sans-serif; color: #fff; text-shadow: 0 0 3px #5a2a00, 4px 4px 0 #5a2a00, -4px 4px 0 #5a2a00, 4px -4px 0 #5a2a00, -4px -4px 0 #5a2a00, 0 0 30px rgba(255,200,80,.8); }
  .head .pk { padding: 8px 26px; border-radius: 999px; background: rgba(20,14,8,.85); color: #fff3d6; font: 900 32px 'Noto Sans JP'; }
  .note { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 12px 40px; border-radius: 999px; background: rgba(20,14,8,.88); color: #fff3d6; font: 900 40px 'Noto Sans JP'; white-space: nowrap; box-shadow: 0 0 30px rgba(0,0,0,.6); }
  .legend { position: absolute; right: 44px; top: 44px; padding: 10px 20px; border-radius: 14px; background: rgba(20,14,8,.7); color: #fff3d6; font: 900 22px 'Noto Sans JP'; display: flex; align-items: center; gap: 10px; }
  .legend i { display: inline-block; width: 22px; height: 22px; border-radius: 50%; }
  .result { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0; text-align: center; transition: opacity .4s, transform .5s cubic-bezier(.2,1.5,.4,1); }
  .result.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .result b { display: block; font: normal 120px 'Dela Gothic One', sans-serif; color: #ffe27a; text-shadow: 0 0 4px #5a2a00, 6px 6px 0 #7a1a00, -6px 6px 0 #7a1a00, 6px -6px 0 #7a1a00, -6px -6px 0 #7a1a00, 0 0 60px rgba(255,200,60,1); }
  .result span { display: inline-block; margin-top: 16px; padding: 8px 32px; border-radius: 999px; background: rgba(20,14,8,.85); color: #fff; font: 900 48px 'Noto Sans JP'; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hud">
  <div class="head" id="head"></div>
  <div class="legend" id="legend"></div>
  <div class="result" id="result"><b>交渉権確定</b><span id="result-team"></span></div>
  <div class="note" id="note"></div>
</div>
<script type="module" src="lots3d.js"></script>
</body>
</html>
