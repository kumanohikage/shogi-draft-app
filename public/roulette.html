<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>将棋ドラフト抽選ルーレットDX</title>
<!-- フォントはアプリに同梱(ネットが無くても表示できる) -->
<link href="vendor/fonts/dela-gothic-one/font.css" rel="stylesheet">
<link href="vendor/fonts/noto-sans-jp/font.css" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<style>
  :root {
    --accent: #f59e0b;
    --accent2: #ea580c;
    --ui-bg: rgba(255, 251, 235, .82);
    --ui-fg: #4a2a05;
    --ui-border: rgba(217, 119, 6, .6);
    --heavy: 'Dela Gothic One', 'Noto Sans JP', sans-serif;
  }
  body.mode-dark {
    --accent: #a855f7;
    --accent2: #6366f1;
    --ui-bg: rgba(20, 8, 40, .78);
    --ui-fg: #ead8ff;
    --ui-border: rgba(168, 85, 247, .6);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: 'Noto Sans JP', system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
    color: var(--ui-fg);
    /* スマホ: ダブルタップ拡大・タップの青いハイライト・長押しメニュー・引っ張り更新を止める */
    touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; overscroll-behavior: none;
  }
  button, #pv { touch-action: manipulation; }
  #pv { touch-action: pan-y; }
  body.green { background: #00ff00; }
  /* ?transparent: 背景を本当に透明にする(OBS のブラウザソースはそのまま透過で重ねられる) */
  html.transparent, html.transparent body { background: transparent; }
  /* 舞台: 16:9 / 9:16 の比率を保ったまま窓に合わせて拡大縮小。余りは黒帯(グリーンバック時は緑) */
  #gl { position: fixed; left: 0; top: 0; display: block; }
  #stage { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; --vw: 19.2px; --vh: 10.8px; }
  #stage > * { position: absolute; }
  /* 舞台そのものはクリックを素通しして、下のルーレット(canvas)に届ける */
  #stage { pointer-events: none; }
  #result, #settings { pointer-events: auto; }

  /* ---------- UI ---------- */
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; transition: opacity .4s; }
  #ui > * { pointer-events: auto; }
  body.ui-hidden #ui { opacity: 0; pointer-events: none; }
  body.ui-hidden #ui > * { pointer-events: none; }
  /* スピン中は UI をフェードで消す(結果が出たら戻る) */
  body.spinning #ui, body.result-open #ui { opacity: 0; pointer-events: none; }
  body.spinning #ui > *, body.result-open #ui > * { pointer-events: none; }
  /* リーチ中は UI をフェードで消し、終わったらフェードで戻す */
  body.reaching #ui { opacity: 0; pointer-events: none; transition: opacity .6s; }
  body.reaching #ui > * { pointer-events: none; }

  header {
    position: absolute; top: 12px; left: 16px; right: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
  #app-title {
    font-family: var(--heavy); font-size: 20px; letter-spacing: .06em; margin: 0;
    padding: 6px 14px; border-radius: 10px; background: var(--ui-bg); border: 1px solid var(--ui-border);
  }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .tool {
    font: 700 12px 'Noto Sans JP', sans-serif; color: var(--ui-fg);
    padding: 7px 11px; border-radius: 9px; cursor: pointer;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
  }
  a.tool { text-decoration: none; display: inline-block; }
  .tool:hover { filter: brightness(1.15); }

  /* 評価値バーが出ている間は、同じ場所の指名者表示を隠す */
  body.evaling #matchup, body.evaling header { opacity: 0 !important; pointer-events: none; }
  #matchup {
    position: absolute; top: 64px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px);
    padding: 6px 24px 7px; border-radius: 14px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: linear-gradient(180deg, #fff7d6, #fcd34d); border: 2px solid #f59e0b; color: #4a2a05;
    box-shadow: 0 0 24px rgba(251, 191, 36, .6); font-family: var(--heavy); font-size: 28px; line-height: 1.15; letter-spacing: .04em;
    transition: opacity .3s;
  }
  #matchup small { display: block; font: 700 11px 'Noto Sans JP', sans-serif; margin-top: 2px; opacity: .85; letter-spacing: 0; }
  #btn-spin {
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    font-family: var(--heavy); font-size: 30px; letter-spacing: .12em; color: #fff;
    padding: 14px 64px; border-radius: 999px; border: 3px solid rgba(255,255,255,.8); cursor: pointer;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    box-shadow: 0 0 28px var(--accent), inset 0 3px 0 rgba(255,255,255,.45);
    text-shadow: 0 2px 0 rgba(0,0,0,.35);
    transition: opacity .3s, transform .1s;
    animation: spinGlow 1.6s ease-in-out infinite;
  }
  #btn-spin:active { transform: translateX(-50%) scale(.95); }
  @keyframes spinGlow { 50% { box-shadow: 0 0 46px var(--accent), inset 0 3px 0 rgba(255,255,255,.45); } }
  #hint {
    position: absolute; bottom: 4px; left: 0; right: 0; text-align: center;
    font-size: 10px; color: rgba(255,255,255,.55); text-shadow: 0 1px 2px #000; pointer-events: none;
  }

  /* ---------- Stage FX ---------- */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0;
    box-shadow: inset 0 0 min(calc(28 * var(--vw)), 340px) var(--vcol, #000);
    transition: opacity .5s;
  }
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 60; opacity: 0; background: #fff; }
  #flash.go { animation: flash var(--fd, .5s) ease-out; }
  @keyframes flash { 0% { opacity: var(--fo, .9); } 100% { opacity: 0; } }

  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
  .cutin { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .cutin .band {
    position: absolute; left: -10%; right: -10%; top: 50%; height: calc(36 * var(--vh)); margin-top: calc(-18 * var(--vh));
    animation: band var(--d) both; background: var(--band);
    box-shadow: 0 0 40px var(--glow), inset 0 6px 0 rgba(255,255,255,.35), inset 0 -6px 0 rgba(0,0,0,.35);
  }
  /* 帯: 出現時に斜めの光沢が1回走る + 上下の縁取り + 横に流れる光の筋(流線) */
  .cutin .band { overflow: hidden; }
  .cutin .band::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.55) 50%, transparent 60%);
    background-size: 250% 100%; animation: bandSweep 1.1s ease-in-out .15s both;
  }
  @keyframes bandSweep { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  .cutin .band::before {
    content: ''; position: absolute; left: 0; right: 0; top: 8px; bottom: 8px;
    border-top: 3px solid rgba(255,255,255,.55); border-bottom: 3px solid rgba(0,0,0,.3);
  }
  .cutin .band i {
    position: absolute; left: 0; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
    animation: streak var(--sd) linear infinite;
  }
  @keyframes streak { from { transform: translateX(calc(-30 * var(--vw))); } to { transform: translateX(calc(130 * var(--vw))); } }
  .cutin.small .band { height: calc(18 * var(--vh)); margin-top: calc(-9 * var(--vh)); }
  .cutin .wrap { position: relative; animation: slam var(--d) both; text-align: center; }
  .cutin .main {
    font-family: var(--heavy); line-height: 1.05; letter-spacing: .04em; white-space: nowrap;
    font-size: min(calc(15 * var(--vw)), calc(21 * var(--vh)));
    background: var(--txt); -webkit-background-clip: text; background-clip: text; color: transparent;
    /* 縁取りは -webkit-text-stroke ではなく影の重ねで作る(iPhone Safari で角がトゲトゲにならないように) */
    filter: drop-shadow(2px 0 0 rgba(0,0,0,.6)) drop-shadow(-2px 0 0 rgba(0,0,0,.6)) drop-shadow(0 2px 0 rgba(0,0,0,.6)) drop-shadow(0 -2px 0 rgba(0,0,0,.6)) drop-shadow(0 0 18px var(--glow)) drop-shadow(0 6px 0 rgba(0,0,0,.5));
  }
  .cutin.small .main { font-size: min(calc(8 * var(--vw)), calc(11 * var(--vh))); }
  .cutin .sub {
    font-family: var(--heavy); font-size: min(calc(6 * var(--vw)), calc(8 * var(--vh))); color: #fff; margin-top: .2em;
    filter: drop-shadow(2px 0 0 rgba(0,0,0,.7)) drop-shadow(-2px 0 0 rgba(0,0,0,.7)) drop-shadow(0 2px 0 rgba(0,0,0,.7)) drop-shadow(0 -2px 0 rgba(0,0,0,.7)) drop-shadow(0 0 12px var(--glow));
  }
  @keyframes band {
    0% { transform: skewY(-5deg) scaleY(0); opacity: 1; }
    10% { transform: skewY(-5deg) scaleY(1.15); }
    16% { transform: skewY(-5deg) scaleY(1); }
    84% { transform: skewY(-5deg) scaleY(1); opacity: 1; }
    100% { transform: skewY(-5deg) scaleY(0); opacity: 0; }
  }
  @keyframes slam {
    0% { transform: scale(3.2) rotate(-6deg); opacity: 0; }
    13% { transform: scale(.9) rotate(0); opacity: 1; }
    19% { transform: scale(1.06); }
    25% { transform: scale(1); }
    84% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  /* tiers */
  .t-white  { --band: linear-gradient(180deg,#d8d8e0,#7d7d90); --txt: linear-gradient(180deg,#fff,#ddd 50%,#9a9aa8); --glow: rgba(255,255,255,.7); }
  .t-blue   { --band: linear-gradient(180deg,#1d64ff,#062a8f); --txt: linear-gradient(180deg,#fff,#a8d6ff 45%,#2e86ff 55%,#0b3fb0); --glow: #3aa0ff; }
  .t-green  { --band: linear-gradient(180deg,#14d36b,#03642d); --txt: linear-gradient(180deg,#fff,#b6ffd0 45%,#1fd86f 55%,#05722f); --glow: #22e57a; }
  .t-red    { --band: linear-gradient(180deg,#ff2b2b,#7a0000); --txt: linear-gradient(180deg,#fff,#ffd1d1 40%,#ff3030 55%,#8a0000); --glow: #ff2a2a; }
  .t-gold   { --band: linear-gradient(180deg,#ffe066,#a86400); --txt: linear-gradient(180deg,#fffbe0,#ffe066 40%,#e09b00 56%,#7a4200); --glow: #ffcc33; }
  .t-rainbow{ --band: linear-gradient(90deg,#ff2a2a,#ffb800,#3dff5a,#22c6ff,#7a5cff,#ff3df2,#ff2a2a); --txt: linear-gradient(90deg,#ff4d4d,#ffd84d,#5dff7a,#4dd8ff,#9a7aff,#ff6df5,#ff4d4d); --glow: #fff; }
  .t-rainbow .band, .t-rainbow .main { background-size: 200% 100%; animation-name: band, rb; }
  .t-rainbow .main { animation: rb 1s linear infinite; }
  .t-rainbow .band { animation: band var(--d) both, rb 1s linear infinite; }
  @keyframes rb { to { background-position: 200% 0; } }
  .t-plain  { --band: transparent; --txt: linear-gradient(#aaa,#666); --glow: transparent; }
  .t-plain .band { display: none; }


  /* Result */
  #result { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; cursor: pointer; }
  #result.show { display: flex; }
  #result .rbg { position: absolute; inset: 0; background: radial-gradient(circle, rgba(0,0,0,.25), rgba(0,0,0,.7)); animation: fadeIn .4s both; }
  #result.end .rbg { background: radial-gradient(circle, rgba(255,40,0,.15), rgba(40,0,0,.55)); }
  #result-text {
    position: relative; font-family: var(--heavy); white-space: nowrap; letter-spacing: .04em;
    font-size: min(calc(14 * var(--vw)), calc(20 * var(--vh))); line-height: 1.1;
    background: linear-gradient(180deg, #fff, #e6e6f0 50%, #a9a9bd); -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 3px rgba(0,0,0,.6);
    filter: drop-shadow(0 0 20px rgba(255,255,255,.5)) drop-shadow(0 8px 0 rgba(0,0,0,.5));
    animation: resIn .7s cubic-bezier(.2,1.6,.4,1) both;
  }
  #result.end #result-text {
    font-size: min(calc(16 * var(--vw)), calc(24 * var(--vh)));
    background: linear-gradient(180deg, #fffbe0 0%, #ffe066 30%, #ff9d00 48%, #ff2020 52%, #9a0000 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-stroke: 4px #3a0000;
    filter: drop-shadow(0 0 30px #ff5a00) drop-shadow(0 10px 0 rgba(0,0,0,.6));
    animation: resInEnd 1s cubic-bezier(.2,1.6,.4,1) both, resShake .12s linear .9s 6;
  }
  body.mode-dark #result.end #result-text {
    background: linear-gradient(180deg, #ffe0ff 0%, #e08cff 30%, #a020ff 48%, #ff1a4a 52%, #5a0010 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-stroke: 4px #12001f;
    filter: drop-shadow(0 0 34px #b026ff) drop-shadow(0 10px 0 rgba(0,0,0,.6));
  }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes resIn { 0% { transform: scale(2.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes resInEnd { 0% { transform: scale(2.6) rotate(-8deg); opacity: 0; } 60% { transform: scale(.92) rotate(0); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes resShake { 25% { transform: translate(-6px, 3px); } 50% { transform: translate(5px, -4px); } 75% { transform: translate(-3px, -2px); } }

  .t-zebra { --band: repeating-linear-gradient(115deg,#0a0a0a 0 26px,#f4f4f4 26px 52px); --txt: linear-gradient(180deg,#fffbe0,#ffe066 40%,#e09b00 56%,#7a4200); --glow: #fff; }

  /* つるつる文字(SVG) */
  .glw { position: relative; }
  .glw canvas { display: block; width: 100%; height: auto; }
  .glw .shine { position: absolute; inset: 0; overflow: hidden; opacity: .75; pointer-events: none; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
  .glw .shine i { position: absolute; top: 0; bottom: 0; left: 0; width: 22%; background: linear-gradient(105deg, transparent, rgba(255,255,255,.95) 50%, transparent); animation: shineMove 1.3s linear infinite; }
  @keyframes shineMove { from { transform: translateX(-110%); } to { transform: translateX(470%); } }
  .cutin .main.gl { background: none; -webkit-text-stroke: 0; filter: none; }
  .cutin .main.gl .glw { width: min(calc(86 * var(--vw)), calc(var(--ar, 4) * 26 * var(--vh))); }
  /* 全回転などの特別なカットインは、光と闇と同じく画面いっぱいの大きさで */
  .cutin.huge .main.gl .glw { width: min(calc(54 * var(--vw)), calc(var(--ar, 4) * 40 * var(--vh))); }
  /* 短い言葉(激熱など)を大きく見せる */
  .cutin.big .main.gl .glw { width: min(calc(86 * var(--vw)), calc(var(--ar, 4) * 40 * var(--vh))); }
  .cutin.small .main.gl .glw { width: min(calc(60 * var(--vw)), calc(var(--ar, 4) * 13 * var(--vh))); }
  .cutin .main.gl .glw canvas { filter: drop-shadow(0 0 22px var(--glow)); }
  #result-text.gl, #result.end #result-text.gl, body.mode-dark #result.end #result-text.gl { background: none; -webkit-text-stroke: 0; filter: none; }
  #result-text.gl .glw { width: min(calc(92 * var(--vw)), calc(150 * var(--vh))); }
  #result-text.gl .glw canvas { filter: drop-shadow(0 0 30px rgba(255,120,0,.6)); }
  body.mode-dark #result-text.gl .glw canvas { filter: drop-shadow(0 0 34px rgba(176,38,255,.8)); }

  /* ステップアップ(駒) */
  #steps { position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; justify-content: center; align-items: flex-end; gap: calc(1.4 * var(--vw)); z-index: 41; pointer-events: none; }
  #steps.out { animation: stepsOut .35s ease-in forwards; }
  @keyframes stepsOut { to { opacity: 0; transform: translateY(-50%) scale(1.25); } }
  /* 影(発光)が箱の外に出ると iPhone の Safari では動いている間に切れて見えるので、余白で箱を広げておく */
  .komaw { padding: 28px; margin: -28px; animation: komaIn .32s cubic-bezier(.3,1.6,.5,1) both; filter: drop-shadow(0 0 16px var(--gl)) drop-shadow(0 6px 0 rgba(0,0,0,.5)); }
  .koma {
    --s: min(calc(13 * var(--vh)), calc(11 * var(--vw))); width: var(--s); height: calc(var(--s) * 1.18); padding: 7px; box-sizing: border-box;
    background: var(--fr); clip-path: polygon(50% 0, 88% 20%, 100% 100%, 0 100%, 12% 20%);
  }
  #steps.many .koma { --s: min(calc(11 * var(--vh)), calc(8.4 * var(--vw))); }
  .f-plain { --fr: linear-gradient(#fff6d8, #c99a3c 50%, #6a4410); --gl: rgba(255,220,140,.7); }
  #steps.many .komaw.big .koma { --s: min(calc(15 * var(--vh)), calc(11 * var(--vw))); }
  .komaw.big .koma { --s: min(calc(19 * var(--vh)), calc(15 * var(--vw))); padding: 9px; }
  .koma i {
    display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; padding-top: 14%; box-sizing: border-box;
    background: linear-gradient(160deg, #f7dc9c, #d9a85a 60%, #b07a32); clip-path: polygon(50% 0, 88% 20%, 100% 100%, 0 100%, 12% 20%);
    font: normal 900 calc(var(--s) * .46) 'Noto Sans JP', serif; color: #1a0d00;
  }
  @keyframes komaIn { 0% { transform: translateY(calc(-60 * var(--vh))) rotate(-30deg) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .f-white { --fr: linear-gradient(#fff, #9a9aa8); --gl: rgba(255,255,255,.7); }
  .f-blue { --fr: linear-gradient(#9ad2ff, #0b3fb0); --gl: #3aa0ff; }
  .f-green { --fr: linear-gradient(#b6ffd0, #05722f); --gl: #22e57a; }
  .f-red { --fr: linear-gradient(#ffb0b0, #a00000); --gl: #ff2a2a; }
  .f-gold { --fr: linear-gradient(#fffbe0, #ffd84a 40%, #a86400); --gl: #ffcc33; }
  .f-zebra { --fr: repeating-linear-gradient(120deg, #111 0 9px, #fff 9px 18px); --gl: #fff; }
  .f-rainbow { --fr: linear-gradient(135deg, #ff2a2a, #ffb800, #3dff5a, #22c6ff, #7a5cff, #ff3df2); --gl: #fff; }

  /* PUSH の種類 */


  /* 縦では文字を大きく(スマホで小さくならないように) */
  body.vertical .cutin .main { font-size: calc(19 * var(--vw)); }
  body.vertical .cutin.small .main { font-size: calc(15 * var(--vw)); }
  body.vertical .cutin .main.gl .glw { width: min(calc(96 * var(--vw)), calc(var(--ar, 4) * 24 * var(--vw))); }
  body.vertical .cutin.huge .main.gl .glw { width: calc(86 * var(--vw)); }
  body.vertical .cutin.big .main.gl .glw { width: min(calc(96 * var(--vw)), calc(var(--ar, 4) * 36 * var(--vw))); }
  body.vertical .cutin.small .main.gl .glw { width: min(calc(90 * var(--vw)), calc(var(--ar, 4) * 17 * var(--vw))); }
  body.vertical .cutin .band { height: calc(24 * var(--vh)); margin-top: calc(-12 * var(--vh)); }
  body.vertical .cutin.small .band { height: calc(14 * var(--vh)); margin-top: calc(-7 * var(--vh)); }
  body.vertical #result-text.gl .glw { width: calc(96 * var(--vw)); }
  body.vertical #result-text { font-size: calc(17 * var(--vw)); }

  /* PUSH: 斜めから見た本物のボタン(銀の縁・透けたドーム・厚み) + 「ボタンを押せ!!」 + 背後の放射光 */
  #push {
    position: absolute; left: 50%; bottom: 24px; width: 1000px; height: 600px; margin-left: -500px; z-index: 55;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    pointer-events: none; opacity: 0; transform: scale(.5); transition: opacity .15s, transform .35s cubic-bezier(.3,1.7,.5,1);
    --d1: #ff8a8a; --d2: #e00000; --d3: #5a0000; --glow: #ff2a2a; --ray: rgba(255,70,40,.55);
  }
  #push.show { opacity: 1; transform: scale(1); pointer-events: auto; }
  #push.gold { --d1: #fff6b0; --d2: #ffb000; --d3: #6a3a00; --glow: #ffcc33; --ray: rgba(255,210,80,.6); }
  #push.zebra { --glow: #fff; --ray: rgba(255,255,255,.55); }
  #push.rainbow { --glow: #fff; --ray: rgba(255,255,255,.6); }
  #push .pburst {
    position: absolute; left: 50%; bottom: 150px; width: 1100px; height: 1100px; margin: 0 0 -550px -550px; border-radius: 50%;
    background: repeating-conic-gradient(transparent 0 9deg, var(--ray) 9deg 14deg);
    -webkit-mask-image: radial-gradient(circle, #000 12%, transparent 62%); mask-image: radial-gradient(circle, #000 12%, transparent 62%);
    animation: pspin 7s linear infinite; pointer-events: none;
  }
  #push.rainbow .pburst { background: repeating-conic-gradient(#ff3b3b88 0 5deg, transparent 5deg 10deg, #ffd84d88 10deg 15deg, transparent 15deg 20deg, #4dd8ff88 20deg 25deg, transparent 25deg 30deg); }
  @keyframes pspin { to { transform: rotate(360deg); } }
  #push .ptext { position: relative; width: 900px; margin-bottom: -10px; transform-origin: 50% 100%; }
  #push.show .ptext { animation: ptextIn .45s cubic-bezier(.2,1.6,.4,1) both, ptextBeat .5s ease-in-out .45s infinite alternate; }

  body.vertical #result-text.draft .r-leader .glw { --lw: min(calc(94 * var(--vw)), calc(var(--ar, 4) * 23 * var(--vw))); }

  if (n >= 2 && chance(0.25)) { let a; do { a = Math.floor(Math.random() * n); } while (a === finalLead); leads = [a, finalLead]; }
  const pattern = pickW({ straight: 35, short: 30, revive: 35 });
  // ステップアップの段数(歩=1 … 玉=8)。熱いリーチほど上まで上がる
  const steps = +[() => pickW({ 2: 3, 3: 4, 4: 3, 5: 1 }), () => pickW({ 5: 2, 6: 3 }), () => pickW({ 6: 1, 7: 2 }), () => pickW({ 7: 1, 8: 3 })][hv]();
  const pseudoN = [() => +chance(0.5), () => 1 + chance(0.5), () => 2, () => 2 + chance(0.5)][hv]();
  // リーチから全回転になる回は、それまでの演出を勝者と無関係(完全ランダム)にする
  const pseudo = Array.from({ length: restart ? 0 : pseudoN }, () => (zen ? Math.floor(Math.random() * n) : point(SIGN_REL)));
  const gemLead = zen ? Math.floor(Math.random() * n) : point(SIGN_REL);
  const swarm = !restart && chance([0.12, 0.35, 0.5, 0.6][hv]);
  const gimmick = chance([0.08, 0.3, 0.45, 0.5][hv]);
  const gekiatsu = (heat === 'gold' || heat === 'zebra') && heatPath.length === 1 && chance(0.35);
  const vibe = chance(hv >= 1 ? 0.2 : 0.06);
  const push = false; // アプリ埋め込み: PUSH 演出なし
  const mash = push && heat === 'rainbow';
  // 宝石: 指すリーダーの色に変わる。変わるタイミングはばらばら。変わらない煽りもある
  const gemEvents = [];
  if (!restart) {
    const pts = push ? ['start', 'mid', 'reach', 'creep', 'push'] : ['start', 'mid', 'reach', 'creep'];
    const at = pickW(Object.fromEntries(pts.map((k) => [k, { start: 20, mid: 25, reach: 20, creep: 20, push: 15 }[k]])));
    if (chance(0.3)) gemEvents.push({ at, kind: 'tease' });
    gemEvents.push({ at, kind: 'change', to: `L${gemLead}` });
    if (chance(TEASE_RATE)) gemEvents.push({ at: pts[Math.floor(Math.random() * pts.length)], kind: 'tease' });
  }
  const opts = TOKIN_BY_HEAT[heatPath[0]];
  const furigoma = !restart && chance(DRAFT_FURIGOMA) ? opts[Math.floor(Math.random() * opts.length)] : -1;
  return {
    freeze: false, restart, heat, heatPath, leads, pattern, steps, pseudo, swarm, gemLead, vibe, gimmick, gekiatsu, push, mash, gemEvents, furigoma,
    reachFreeze: !restart && chance(DRAFT_REACH_FREEZE), reachZenkai: zen, donden: chance(DRAFT_DONDEN),
  };
}

/* ---------- つるつる文字(パチンコ文字風 SVG) ---------- */
let glossId = 0;
const GLOSS = {
  gold:    { rim: ['#ffffff', '#dfe8ff', '#8a96b8', '#ffffff', '#9aa6c8', '#2a3050'], face: ['#fff6c8', '#ffd21a', '#f08a00', '#a84200', '#ffc21a', '#ffe680'], line: '#3a0000', ext: '#4a0d00' },
  red:     { rim: ['#fff7c0', '#ffd34a', '#a86400', '#fff2a0', '#c07800', '#5a3000'], face: ['#ffd0d0', '#ff4a4a', '#e60000', '#7a0000', '#ff2a2a', '#ff9a9a'], line: '#200000', ext: '#3a0800' },
  purple:  { rim: ['#ffffff', '#e6d8ff', '#8a72b8', '#ffffff', '#a090c8', '#2a2050'], face: ['#ffd8fa', '#ff5ad8', '#d000b0', '#5a0080', '#ff3ad0', '#ffa8f0'], line: '#12001f', ext: '#20002f' },
  rainbow: { rim: ['#fff7c0', '#ffd34a', '#a86400', '#fff2a0', '#c07800', '#5a3000'], face: null, line: '#200030', ext: '#2a0040' },
};
// つるつる文字は起動時に canvas で1回だけ描いてキャッシュする。
// (SVG フィルターだと出現のたびに大きく描き直して 0.2〜0.5 秒止まっていた)
const glossCache = new Map();
function renderGlossy(text, scheme) {
  const g = GLOSS[scheme] || GLOSS.gold;
  const fs = 280, k = fs / 160, n = [...text].length;   // 大きく表示しても荒れない解像度
  const W = Math.round(n * fs + 120 * k), H = Math.round(fs * 1.62);
  const x = W / 2, y = Math.round(fs * 1.12);
  const top = y - fs * 0.9, bot = y + fs * 0.12;
  const CHROME = [0, 0.36, 0.49, 0.51, 0.8, 1];
  const vgrad = (ctx, cols) => {
    const gr = ctx.createLinearGradient(0, top, 0, bot);
    cols.forEach((c, i) => gr.addColorStop(cols.length === 6 ? CHROME[i] : i / (cols.length - 1), c));
    return gr;
  };
  const layer = () => { const c = makeCanvas(W, H), cx = c.getContext('2d'); setFont(cx); return [c, cx]; };
  const setFont = (cx) => { cx.font = `${fs}px 'Dela Gothic One', 'Noto Sans JP', sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'alphabetic'; cx.lineJoin = 'round'; cx.miterLimit = 2; };
  const [C, ctx] = layer();
  // 太い縁取りは strokeText を使わず、文字を円周上にずらして塗り重ねて作る
  // (iPhone Safari の strokeText は角がトゲトゲに飛び出すため)
  const masks = {};
  const dilate = (w) => {
    if (masks[w]) return masks[w];
    const [c2, x2] = layer();
    x2.fillStyle = '#fff';
    // 円周上に隙間なく並べる(間隔が空くと縁がギザギザになる)
    const r = w / 2;
    for (const rr of [r, r * 0.66, r * 0.33]) for (let i = 0, steps = Math.max(16, Math.ceil(TAU * rr / 1.2)); i < steps; i++) {
      const a = (i / steps) * TAU;
      x2.fillText(text, x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    x2.fillText(text, x, y);
    return (masks[w] = c2);
  };
  const colored = (w, style) => {
    const [c2, x2] = layer();
    x2.drawImage(dilate(w), 0, 0);
    x2.globalCompositeOperation = 'source-in';
    x2.fillStyle = typeof style === 'function' ? style(x2) : style; x2.fillRect(0, 0, W, H);
    return c2;
  };

  // 厚み(押し出し)
  const extC = colored(40 * k, g.ext);
  for (let i = 26; i >= 1; i--) ctx.drawImage(extC, 0, i * 1 * k);   // 細かく重ねて段差を出さない
  // 外側の黒縁 → メッキの縁
  ctx.drawImage(colored(40 * k, '#0a0300'), 0, 0);
  ctx.drawImage(colored(30 * k, (cx) => vgrad(cx, g.rim)), 0, 0);
  emboss(ctx, (cx) => cx.drawImage(dilate(30 * k), 0, 0), 4 * k);
  // 内側の細い線 → 面
  ctx.drawImage(colored(9 * k, g.line), 0, 0);
  if (g.face) ctx.fillStyle = vgrad(ctx, g.face);
  else {
    const gr = ctx.createLinearGradient(x - W / 2, 0, x + W / 2, 0);
    ['#ff3b3b', '#ffcc00', '#4dff6a', '#33d6ff', '#8a6bff', '#ff4de6', '#ff3b3b'].forEach((c, i, a) => gr.addColorStop(i / (a.length - 1), c));
    ctx.fillStyle = gr;
  }
  ctx.fillText(text, x, y);
  emboss(ctx, (cx) => cx.fillText(text, x, y), 5 * k);

  // 面の上に重ねる模様(虹は菱形)と上半分の光沢
  const overlay = (paint, alpha) => {
    const [c2, x2] = layer();
    x2.fillStyle = '#fff'; x2.fillText(text, x, y);
    x2.globalCompositeOperation = 'source-in';
    paint(x2);
    ctx.globalAlpha = alpha; ctx.drawImage(c2, 0, 0); ctx.globalAlpha = 1;
  };
  if (!g.face) overlay((x2) => {
    const pc = makeCanvas(34), px = pc.getContext('2d');
    px.fillStyle = '#fff'; px.fillRect(0, 0, 17, 17); px.fillRect(17, 17, 17, 17);
    const pat = x2.createPattern(pc, 'repeat'); pat.setTransform(new DOMMatrix().rotate(45));
    x2.fillStyle = pat; x2.fillRect(0, 0, W, H);
  }, 0.22);
  overlay((x2) => {
    const gr = x2.createLinearGradient(0, top, 0, bot);
    gr.addColorStop(0, 'rgba(255,255,255,.75)'); gr.addColorStop(0.2, 'rgba(255,255,255,.25)');
    gr.addColorStop(0.42, 'rgba(255,255,255,.08)'); gr.addColorStop(0.44, 'rgba(255,255,255,0)');
    x2.fillStyle = gr; x2.fillRect(0, 0, W, H);
  }, 1);

  // 光の筋用のマスク(文字の形)
  const [M, mx] = layer();
  mx.fillStyle = '#fff'; mx.fillText(text, x, y);
  return { canvas: C, mask: M.toDataURL('image/png'), W, H };

  // 縁の左上に光、右下に影を入れて立体に見せる(SVG の specular の代わり)
  function emboss(dst, drawShape, d) {
    for (const [dx, col, a] of [[d, '#fff', 0.85], [-d, '#000', 0.35]]) {
      const [c2, x2] = layer();
      x2.fillStyle = '#fff'; x2.strokeStyle = '#fff';
      drawShape(x2);
      x2.globalCompositeOperation = 'destination-out';
      x2.save(); x2.translate(dx, dx); drawShape(x2); x2.restore();
      x2.globalCompositeOperation = 'source-in';
      x2.fillStyle = col; x2.fillRect(0, 0, W, H);
      dst.save();
      dst.globalCompositeOperation = 'source-atop'; dst.globalAlpha = a; dst.filter = `blur(${Math.max(1, d * 0.4)}px)`;
      dst.drawImage(c2, 0, 0);
      dst.restore();
    }
  }
}
// Webフォントは文字ごとに分割して配信されるので、canvas で使う文字がまだ届いていないことがある。
// 届いていないときは代わりのフォントで描くだけにして覚えず、文字を取り寄せる(次からは正しいフォントで描く)
const GLOSS_FONT = `280px 'Dela Gothic One'`;
function getGlossy(text, scheme) {
  const key = `${text}|${scheme}`;
  if (glossCache.has(key)) return glossCache.get(key);
  const ready = document.fonts.check(GLOSS_FONT, text);
  const gl = renderGlossy(text, scheme);
  if (ready) glossCache.set(key, gl);
  else document.fonts.load(GLOSS_FONT, text).catch(() => {});
  return gl;
}
// 表示用の要素を作る(キャッシュ済みの画を複写するだけなので軽い)
function glossy(text, scheme) {
  const gl = getGlossy(text, scheme);
  const wrap = document.createElement('div');
  wrap.className = 'glw';
  // 縦横比(文字数で変わる)。CSS で「文字の高さ基準・長い名前だけ横幅に収める」計算に使う
  wrap.style.setProperty('--ar', (gl.W / gl.H).toFixed(3));
  const c = makeCanvas(gl.W, gl.H);
  c.getContext('2d').drawImage(gl.canvas, 0, 0);
  const sh = document.createElement('div');
  sh.className = 'shine';
  sh.style.webkitMaskImage = sh.style.maskImage = `url(${gl.mask})`;
  sh.innerHTML = '<i></i>';
  wrap.append(c, sh);
  return wrap;
}
// 使う文字は決まっているので、起動後に少しずつ先に作っておく
function warmGlossy() {
  const jobs = [['抽選リーチ', 'red'], ['抽選リーチ', 'gold'], ['抽選リーチ', 'rainbow'],
    ['激熱', 'red'], ['交渉権確定!', 'red'], ['全回転', 'rainbow'], ['再抽選!!', 'rainbow'], ...draft.leaders.map((n) => [n, 'gold']), [draft.pick, 'gold'],
    ['ボタンを押せ!!', 'red'], ['ボタンを押せ!!', 'gold'], ['ボタンを押せ!!', 'rainbow'], ['ボタンを連打!!', 'gold'], ['ボタンを連打!!', 'rainbow']];
  // 最初のカットインだけ 0.1 秒ほど止まる(描画の初回準備)ので、見えないカットインを先に1回出しておく
  const next = () => { const j = jobs.shift(); if (!j) { cutin('抽選リーチ', 't-gold', { dur: 900, gloss: 'gold', ghost: true }); return; } getGlossy(...j); setTimeout(next, 60); };
  setTimeout(next, 300);
}

const ambient = new THREE.AmbientLight(0xffffff, 0.35);

const tierLight = new THREE.PointLight(0xffffff, 0, 40, 1.2);

const alphaPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, tScene: { value: null } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform sampler2D tDiffuse, tScene; varying vec2 vUv;

/* ---------- 背景シェーダー ---------- */
const bgUniforms = {
  uTime: { value: 0 }, uDark: { value: 0 }, uReach: { value: 0 }, uWin: { value: 0 }, uDim: { value: 0 }, uGlow: { value: 0.45 },
  uTier: { value: new THREE.Color(1, 1, 1) }, uAspect: { value: 1 },
};
const bg = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.ShaderMaterial({
    uniforms: bgUniforms, depthWrite: false,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform float uTime, uDark, uReach, uWin, uDim, uGlow, uAspect; uniform vec3 uTier; varying vec2 vUv;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
      void main(){
        vec2 p = (vUv - 0.5) * vec2(uAspect, 1.0) * 2.0;
        float r = length(p), a = atan(p.y, p.x);
        float spd = 0.15 + uReach * 1.6 + uWin * 0.8;
        // uGlow: 後光の強さ(演出の盛り上がりに合わせて変わる)
        float rays = pow(0.5 + 0.5 * sin(a * 14.0 + uTime * spd * 3.0), 4.0) * uGlow;
        float rays2 = pow(0.5 + 0.5 * sin(a * 7.0 - uTime * spd * 2.0), 6.0) * uGlow;
        // 光: 黄金の後光
        vec3 lc = mix(vec3(0.34, 0.20, 0.05), vec3(0.09, 0.035, 0.005), smoothstep(0.0, 1.7, r));
        lc += (rays * 0.16 + rays2 * 0.08) * vec3(1.0, 0.75, 0.35) * (1.0 - smoothstep(0.1, 2.2, r));
        // 闇: 渦と星
        float sw = sin(a * 5.0 + r * 7.0 - uTime * (0.5 + uReach * 3.0));
        vec3 dc = mix(vec3(0.10, 0.02, 0.20), vec3(0.004, 0.0, 0.012), smoothstep(0.0, 1.5, r));
        dc += (0.5 + 0.5 * sw) * 0.10 * uGlow * vec3(0.55, 0.12, 0.9) * (1.0 - smoothstep(0.2, 1.9, r));
        vec2 sv = vUv * vec2(uAspect, 1.0) * 90.0; vec2 g = floor(sv);
        float st = step(0.985, hash(g)) * smoothstep(0.22, 0.0, length(fract(sv) - 0.5)) * (0.5 + 0.5 * sin(uTime * 3.0 + hash(g + 3.1) * 40.0));
        dc += st * vec3(0.8, 0.6, 1.0);
        vec3 col = mix(lc, dc, uDark);

        col = mix(col, uTier * (0.08 + 0.3 * rays), uReach * 0.7);

        vec3 rb = 0.5 + 0.5 * cos(6.2831 * (a / 6.2831 * 2.0 + uTime * 0.35 + vec3(0.0, 0.33, 0.67)));
        col += uWin * (rays * 0.35 + 0.05) * rb;
        col *= 1.0 - uDim * 0.8;
        col *= 1.0 - 0.5 * smoothstep(0.7, 2.3, r);
        gl_FragColor = vec4(col, 1.0);
      }`,
  })
);
bg.position.z = -40;
bg.renderOrder = -1;
scene.add(bg);

/* ---------- テクスチャ生成 ---------- */
function makeCanvas(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasTex(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }

// allWinner: 全回転用。全マスを勝者の名前で描く
function drawWheel(mode, allWinner = -1) {
  const { total } = MODES[mode];
  const S = 2048, c = S / 2, r = S / 2 - 6;
  const mapC = makeCanvas(S), emC = makeCanvas(S);
  const m = mapC.getContext('2d'), e = emC.getContext('2d');
  e.fillStyle = '#000'; e.fillRect(0, 0, S, S);
  const arc = TAU / total;
  const all = allWinner >= 0;
  for (let i = 0; i < total; i++) {
    // 数学の角度 a は 3D では反時計回り。キャンバスは y が下向きなので -a で描く。
    const a0 = i * arc, a1 = a0 + arc;
    const li = all ? allWinner : leaderOf(i);
    const col = new THREE.Color(leaderColor(li));
    const hex = (cc) => `#${cc.getHexString()}`;
    const light = col.clone().lerp(new THREE.Color('#ffffff'), 0.55), dark = col.clone().multiplyScalar(0.55);
    const p = new Path2D(); p.moveTo(c, c); p.arc(c, c, r, -a0, -a1, true); p.closePath();
    const grad = m.createRadialGradient(c, c, r * 0.12, c, c, r);
    grad.addColorStop(0, hex(light)); grad.addColorStop(0.6, hex(col)); grad.addColorStop(1, hex(dark));
    m.fillStyle = grad; m.fill(p);
    m.lineWidth = 8; m.strokeStyle = all ? '#ffe680' : '#d9a420'; m.stroke(p);
    // 発光: 名前の色をうっすら(全回転のときは強め)
    e.fillStyle = hex(col.clone().multiplyScalar(all ? 0.55 : 0.18)); e.fill(p);
    e.lineWidth = all ? 14 : 4; e.strokeStyle = all ? '#ffcc33' : '#3a2600'; e.stroke(p);

    // 縦書きの名前: 文字の上側が外周を向く。針(上)に来たとき正立する。
    const name = draft.leaders[li] || '';
    const chars = [...name];
    const mid = (a0 + a1) / 2;
    const room = r * 0.52;
    const size = Math.min(170, r * 0.86 * arc * 0.5, room / Math.max(1, chars.length * 1.02));
    for (const ctx of all ? [m, e] : [m]) {
      ctx.save();
      ctx.translate(c, c); ctx.rotate(-mid);
      ctx.font = `${size}px 'Dela Gothic One', 'Noto Sans JP', sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      chars.forEach((ch, k) => {
        ctx.save();
        ctx.translate(r * 0.88 - size * 0.55 - k * size * 1.02, 0);
        ctx.rotate(Math.PI / 2);
        if (ctx === m) {
          ctx.lineWidth = size * 0.16; ctx.strokeStyle = 'rgba(30,10,0,.85)'; ctx.lineJoin = 'round';
          if ('ー－―‐-〜～…'.includes(ch)) { ctx.save(); ctx.rotate(Math.PI / 2); ctx.strokeText(ch, 0, 0); ctx.restore(); } else ctx.strokeText(ch, 0, 0);
          ctx.fillStyle = all ? '#ffe066' : '#ffffff';
        } else ctx.fillStyle = '#ffd84a';
        // 縦書きでは長音・ダッシュ・波線は縦向きにする
        if ('ー－―‐-〜～…'.includes(ch)) ctx.rotate(Math.PI / 2);
        ctx.fillText(ch, 0, 0);
        ctx.restore();
      });
      ctx.restore();
    }
  }
  // 装飾リング
  for (const [rr, w] of [[r * 0.985, 10], [r * 0.3, 8]]) {
    m.beginPath(); m.arc(c, c, rr, 0, TAU); m.lineWidth = w; m.strokeStyle = '#b07800'; m.stroke();
  }
  return { map: canvasTex(mapC), emissive: canvasTex(emC) };
}

let draftImg = null;
// 丸の中に画像を描く。crop.x/y は丸の直径に対する画像中心のずれ、zoom は丸を覆う大きさに対する倍率
function clampCrop(img, crop) {
  const k = Math.max(1 / img.width, 1 / img.height) * crop.zoom;
  const mx = Math.max(0, (img.width * k - 1) / 2), my = Math.max(0, (img.height * k - 1) / 2);
  crop.x = Math.min(mx, Math.max(-mx, crop.x));
  crop.y = Math.min(my, Math.max(-my, crop.y));
  return crop;
}
function drawCropped(x, img, crop, cx, cy, d) {
  if (draft.imgBg) { x.fillStyle = draft.imgBg; x.fillRect(cx - d, cy - d, d * 2, d * 2); }
  const k = Math.max(d / img.width, d / img.height) * crop.zoom;
  const w = img.width * k, h = img.height * k;
  x.drawImage(img, cx - w / 2 + crop.x * d, cy - h / 2 + crop.y * d, w, h);
}
function croppedDataURL(size = 320) {
  if (!draftImg) return '';
  const c = makeCanvas(size), x = c.getContext('2d');
  x.beginPath(); x.arc(size / 2, size / 2, size / 2, 0, TAU); x.clip();
  if (!draft.imgBg) {
    // 結果画面の丸は、背景なしなら半透明の白(中央は濃く、ふちは背景になじむ)
    const g = x.createRadialGradient(size / 2, size / 2, size * 0.1, size / 2, size / 2, size / 2);
    g.addColorStop(0, 'rgba(255,255,255,.8)'); g.addColorStop(1, 'rgba(255,255,255,.45)');
    x.fillStyle = g; x.fillRect(0, 0, size, size);
  }
  drawCropped(x, draftImg, draft.crop, size / 2, size / 2, size);
  try { return c.toDataURL('image/png'); } catch (_) { return draft.image; }
}
function drawEmblem() {
  const S = 512, c = makeCanvas(S), x = c.getContext('2d');
  const g = x.createRadialGradient(S * 0.4, S * 0.35, 10, S / 2, S / 2, S / 2);
  g.addColorStop(0, '#fffbe6'); g.addColorStop(0.6, '#ffd24a'); g.addColorStop(1, '#a86a00');
  x.fillStyle = g; x.beginPath(); x.arc(S / 2, S / 2, S / 2, 0, TAU); x.fill();
  if (draftImg) {
    const rr = S / 2 * 0.86;
    x.save(); x.beginPath(); x.arc(S / 2, S / 2, rr, 0, TAU); x.clip();
    drawCropped(x, draftImg, draft.crop, S / 2, S / 2, rr * 2);
    const sh = x.createRadialGradient(S / 2, S / 2, rr * 0.75, S / 2, S / 2, rr);
    sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(60,30,0,.45)');
    x.fillStyle = sh; x.fillRect(0, 0, S, S);
    x.restore();
    x.lineWidth = 10; x.strokeStyle = '#7a4a00'; x.beginPath(); x.arc(S / 2, S / 2, rr, 0, TAU); x.stroke();
  } else {
    // 刻印の輪だけ(何も無くても違和感がないように)
    for (const [rr, w, a] of [[0.78, 6, 0.55], [0.62, 3, 0.4], [0.3, 3, 0.3]]) {

    }
  }
  return canvasTex(c);
}
function loadDraftImage() {
  return new Promise((resolve) => {
    if (!draft.image) { draftImg = null; return resolve(true); }
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => { draftImg = im; resolve(true); };
    im.onerror = () => { draftImg = null; resolve(false); };
    im.src = draft.image;
  });
}

function drawSprite() {
  const S = 128, c = makeCanvas(S), x = c.getContext('2d');

  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.2, 'rgba(255,255,255,.7)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
  x.globalCompositeOperation = 'lighter';
  for (const [w, h] of [[S, 6], [6, S]]) {

class Particles {
  constructor(n, tex) {
    this.n = n; this.i = 0;
    this.pos = new Float32Array(n * 3); this.col = new Float32Array(n * 3);
    this.size = new Float32Array(n); this.alpha = new Float32Array(n);
    this.vel = new Float32Array(n * 3); this.life = new Float32Array(n); this.max = new Float32Array(n);
    this.grav = new Float32Array(n); this.drag = new Float32Array(n); this.base = new Float32Array(n);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aColor', new THREE.BufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    g.setAttribute('aAlpha', new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage));
    this.uniforms = { uTex: { value: tex }, uScale: { value: 500 } };
    this.points = new THREE.Points(g, new THREE.ShaderMaterial({
      // 色だけ加算してアルファは変えない(透過背景でも四角く残らない)
      uniforms: this.uniforms, transparent: true, depthWrite: false,
      blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
      blendSrcAlpha: THREE.ZeroFactor, blendDstAlpha: THREE.OneFactor,
      vertexShader: `attribute vec3 aColor; attribute float aSize; attribute float aAlpha; uniform float uScale;
        varying vec3 vC; varying float vA;
        void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); gl_PointSize = aSize * uScale / -mv.z;
          gl_Position = projectionMatrix * mv; vC = aColor; vA = aAlpha; }`,
      fragmentShader: `uniform sampler2D uTex; varying vec3 vC; varying float vA;
        void main(){ vec4 t = texture2D(uTex, gl_PointCoord); gl_FragColor = vec4(vC * t.rgb * t.a * vA, 1.0); }`,
    }));
    this.points.frustumCulled = false;
  }
  emit(x, y, z, vx, vy, vz, color, size, life, grav = 0, drag = 1) {
    const i = this.i; this.i = (this.i + 1) % this.n;
    const k = i * 3;
    this.pos[k] = x; this.pos[k + 1] = y; this.pos[k + 2] = z;
    this.vel[k] = vx; this.vel[k + 1] = vy; this.vel[k + 2] = vz;
    this.col[k] = color.r; this.col[k + 1] = color.g; this.col[k + 2] = color.b;
    this.base[i] = size; this.life[i] = life; this.max[i] = life; this.grav[i] = grav; this.drag[i] = drag;
  }
  update(dt) {
    for (let i = 0; i < this.n; i++) {
      if (this.life[i] <= 0) { this.alpha[i] = 0; this.size[i] = 0; continue; }
      this.life[i] -= dt;
      const k = i * 3, dr = Math.pow(this.drag[i], dt * 60);
      this.vel[k] *= dr; this.vel[k + 1] = this.vel[k + 1] * dr + this.grav[i] * dt; this.vel[k + 2] *= dr;
      this.pos[k] += this.vel[k] * dt; this.pos[k + 1] += this.vel[k + 1] * dt; this.pos[k + 2] += this.vel[k + 2] * dt;
      const f = Math.max(0, this.life[i] / this.max[i]);
      this.alpha[i] = Math.min(1, f * 3) * (0.75 + 0.25 * Math.sin(i * 7.1 + this.life[i] * 20));
      this.size[i] = this.base[i] * (0.4 + 0.6 * f);
    }
    const a = this.points.geometry.attributes;
    a.position.needsUpdate = a.aColor.needsUpdate = a.aSize.needsUpdate = a.aAlpha.needsUpdate = true;
  }
}

const CONF_COLORS = {
  light: ['#ffd700', '#fff4c0', '#ff3b3b', '#ffffff', '#ffb000', '#ff7ad9'],
  dark: ['#b026ff', '#ff1a4a', '#e0c0ff', '#5b21b6', '#ffd700', '#111111'],
};
let confI = 0;
function launchConfetti(mode, n) {
  const cols = CONF_COLORS[mode].map((h) => new THREE.Color(h));
  const vw = viewHalfWidth(), vh = viewHalfHeight();
  for (let k = 0; k < n; k++) {
    const c = conf[confI]; confI = (confI + 1) % CONF_N;
    c.on = true;
    if (k % 3 === 0) { // 下の両端から打ち上げ
      const side = k % 2 ? 1 : -1;
      c.p.set(side * vw * 0.95, -vh * 1.1, rand(-2, 4));
      c.v.set(-side * rand(3, 9), rand(14, 22), rand(-2, 2));
    } else {           // 上から降る
      c.p.set(rand(-vw, vw), rand(vh, vh + 7), rand(-3, 6));
      c.v.set(rand(-1, 1), rand(-3, -1), 0);
    }
    c.r.set(rand(0, TAU), rand(0, TAU), rand(0, TAU));
    c.w.set(rand(-8, 8), rand(-8, 8), rand(-8, 8));
    confetti.setColorAt(confI, cols[k % cols.length]);
  }
  confetti.instanceColor.needsUpdate = true;
  confLive = true;
}
const confDummy = new THREE.Object3D();
let confLive = false;
function updateConfetti(dt) {
  if (!confLive) return;
  let any = false;
  for (let i = 0; i < CONF_N; i++) {
    const c = conf[i];
    if (!c.on) continue;
    c.v.y -= 9 * dt; c.v.multiplyScalar(Math.pow(0.985, dt * 60));
    if (c.v.y < -2.6) c.v.y = -2.6; // ひらひら終端速度
    c.p.addScaledVector(c.v, dt);
    c.p.x += Math.sin(time * 3 + i) * dt * 0.8;
    c.r.x += c.w.x * dt; c.r.y += c.w.y * dt; c.r.z += c.w.z * dt;
    if (c.p.y < -viewHalfHeight() * 1.4) c.on = false; else any = true;
    confDummy.position.copy(c.p); confDummy.rotation.copy(c.r); confDummy.scale.setScalar(c.on ? 1 : 0);
    confDummy.updateMatrix(); confetti.setMatrixAt(i, confDummy.matrix);
  }
  confetti.instanceMatrix.needsUpdate = true;
  confLive = any;
}

const gimmick = new THREE.Group();
{
  const k = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), new THREE.MeshBasicMaterial({ map: kanjiTex[0], transparent: true }));
  k.position.set(0, -0.05, 0.11);

  gimmick.visible = false;
  gimmick.userData.t = -1;
  scene.add(gimmick);
}
function dropGimmick() { gimmick.userData.t = 0; gimmick.visible = true; }
function updateGimmick(dt) {
  const u = gimmick.userData;
  if (u.t < 0) return;
  u.t += dt;
  const t = u.t, top = 18, low = 4.0;
  let y;
  if (t < 0.32) y = top - (top - low) * (t / 0.32) ** 2;                       // 落下
  else if (t < 0.6) y = low + Math.sin((t - 0.32) / 0.28 * Math.PI) * 0.5;     // バウンド
  else if (t < 1.35) y = low;
  else if (t < 1.85) y = low + (top - low) * ((t - 1.35) / 0.5) ** 2;          // 戻る
  else { gimmick.visible = false; u.t = -1; return; }
  if (t >= 0.32 && t - dt < 0.32) { sound.gata(); fx.shake = 1.2; flash('#ffd27a', 0.3, 0.6); }
  gimmick.position.set(0, y, 6);
  gimmick.rotation.set(0, (t > 0.32 && t < 1.35) ? Math.sin(t * 9) * 0.06 : 0, 0);
  gimMat.emissiveIntensity = t > 0.32 && t < 1.35 ? 0.4 + 0.4 * Math.abs(Math.sin(t * 14)) : 0.1;
}

function launchSwarm() {
  const vw = viewHalfWidth();
  swarm.forEach((p, i) => {
    p.visible = true;
    p.userData = { t: -i * 0.045, dur: rand(1.3, 1.8), y: rand(-5, 6), z: rand(1, 9), x0: -vw - 3, x1: vw + 3, ph: rand(0, TAU), s: rand(1.2, 2.2), spin: rand(4, 9) };
    p.scale.setScalar(p.userData.s);
  });
  sound.swarm();
}
function updateSwarm(dt) {
  for (const p of swarm) {
    if (!p.visible) continue;
    const u = p.userData; u.t += dt;
    if (u.t < 0) { p.position.set(-999, 0, 0); continue; }
    const s = u.t / u.dur;
    if (s >= 1) { p.visible = false; continue; }
    p.position.set(u.x0 + (u.x1 - u.x0) * s, u.y + Math.sin(s * 6 + u.ph) * 1.2, u.z);
    p.rotation.set(Math.sin(u.t * 3 + u.ph) * 0.6, u.t * u.spin, Math.sin(u.t * 2) * 0.4);
  }
}

/* ---------- 回転モーション(区間ごとのイージング) ---------- */
const E = {
  in2: (s) => s * s,
  outQuint: (s) => 1 - Math.pow(1 - s, 5),
  inOut3: (s) => (s < 0.5 ? 4 * s * s * s : 1 - Math.pow(-2 * s + 2, 3) / 2),
  outCubic: (s) => 1 - Math.pow(1 - s, 3),
  herm: (m0, m1) => (s) => { const s2 = s * s, s3 = s2 * s; return (s3 - 2 * s2 + s) * m0 + (-2 * s3 + 3 * s2) + (s3 - s2) * m1; },
};
function play(segs) {
  return new Promise((resolve) => {
    let t = 0;
    const list = segs.map((s) => { const o = { ...s, t0: t }; t += s.dur; return o; });
    motion = { list, total: t, start: performance.now(), resolve };
  });
}
function stepMotion(now) {
  if (!motion) return;
  const t = (now - motion.start) / 1000;
  if (t >= motion.total) {
    phi = motion.list[motion.list.length - 1].p1;
    const r = motion.resolve; motion = null; r();
    return;
  }
  const s = motion.list.find((x) => t < x.t0 + x.dur) || motion.list[motion.list.length - 1];
  const k = Math.min(1, (t - s.t0) / s.dur);
  phi = s.p0 + (s.p1 - s.p0) * s.ease(k);
}

// 針(真上)の下に、盤面ローカル角 aT が来る φ を求める（from から minTurns 周以上先）
function phiFor(aT, from, minTurns) {
  const base = aT - Math.PI / 2;
  const k = Math.ceil((from + minTurns * TAU - base) / TAU);
  return base + k * TAU;
}

/* ---------- 評価値: 出た演出から、各リーダーの当たりやすさ(事後確率)を計算して見せる ---------- */
const evalSt = { L: [], mate: -1, won: false };
// 見せ方の強さ: 本当の確率どおりだと結果が読めすぎるので、普段は各演出の効きを弱めて接戦に見せる。
// たまに(2割)本当の強さで動かし、「かなりの優勢で勝つ」回も作る
const DAMP = 0.2;
function evalReset(n) { evalSt.gemKey = 'none'; evalSt.L = Array(n).fill(1); evalSt.mate = -1; evalSt.won = false; evalSt.damp = chance(0.2) ? 1 : (n === 2 ? DAMP : DAMP * 0.7); renderEval(false); $('evalbar').classList.add('show'); document.body.classList.add('evaling'); }
function evalHide() { $('evalbar').classList.remove('show'); document.body.classList.remove('evaling'); }
// lead を信頼度 r で指す演出が出た: 勝者が i なら起きる確率 = i==lead ? r : (1-r)/(n-1)
// rise: 擬似連の仮停止用。指された人は必ず評価値が上がる(+の数字を見せるため)
function evalSignal(lead, r, pulse = true, rise = false) {
  const n = evalSt.L.length;
  if (!n || evalSt.mate >= 0) return;
  const sure = r >= 1;
  r = Math.min(r, 0.99);   // 確定のリーチでも「まだ1%はあるかも」と見せる(詰みは全回転だけ)
  // 信頼度を「人数で割った互角の値」に向けて弱める(普段は DAMP、たまに本当の強さ)。確定の虹だけは弱めない
  const base = 1 / n; if (!sure) r = base + (r - base) * (evalSt.damp ?? 1);
  // 各リーダーに揺らぎも足す(形勢が行ったり来たりして見えるように)
  // 指された人は必ず上向き(揺らぎはプラスだけ)、ほかの人は上下に揺らす
  evalSt.L = rise
    ? evalSt.L.map((v, i) => v * (i === lead ? r * Math.exp(rand(0.15, 0.45)) : (1 - r) / (n - 1) * Math.exp(rand(-0.45, 0.15))))
    : evalSt.L.map((v, i) => v * (i === lead ? r : (1 - r) / (n - 1)) * Math.exp(rand(-0.6, 0.6)));
  renderEval(pulse);
}
// 決着: 勝者で「+3000 勝ち」
function evalWin(lead) { evalSt.won = true; evalSt.mate = lead; evalSt.L = evalSt.L.map((_, i) => (i === lead ? 1 : 0)); renderEval(true); }
// その人の評価値(ほかの中でいちばん高い人との差)。±2000 まで
function evalOf(i) {
  const P = evalSt.P || [];
  const other = Math.max(...P.filter((_, j) => j !== i), 1e-9);
  const v = Math.round(600 * Math.log(Math.max(P[i], 1e-9) / other) / 10) * 10;
  return Math.max(-2000, Math.min(2000, v));
}
function evalMate(lead) { evalSt.mate = lead; evalSt.L = evalSt.L.map((_, i) => (i === lead ? 1 : 0)); renderEval(true); }
// 勝率から評価値へ(将棋ソフトでよく使う 勝率 = 1/(1+exp(-評価値/600)) の逆)。3人以上は 1位と2位 の比で出す
function renderEval(pulse) {
  const bar = $('evalbar');
  const sum = evalSt.L.reduce((a, b) => a + b, 0) || 1;
  let P = evalSt.L.map((v) => v / sum);
  // 決着前は評価値 +2000 を上限にする(1位と2位の比を exp(2000/600) までに抑えて、バーもそれに合わせる)
  if (evalSt.mate < 0) {
    const K = Math.exp(2000 / 600);
    const o = P.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]);
    if (o[1] && o[0][0] > K * o[1][0]) {
      P = P.slice(); P[o[0][1]] = K * o[1][0];
      const t = P.reduce((a, b) => a + b, 0); P = P.map((v) => v / t);
    }
  }
  evalSt.P = P;
  const order = P.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]);
  const [p1, top] = order[0], p2 = order[1] ? order[1][0] : 0;
  const track = bar.querySelector('.eb-track');
  const colorKey = P.map((_, i) => leaderColor(i)).join();
  if (track.dataset.colors !== colorKey) {
    track.dataset.colors = colorKey;
    track.textContent = '';
    P.forEach((_, i) => { const seg = document.createElement('i'); seg.style.background = `linear-gradient(${leaderColor(i)}, ${new THREE.Color(leaderColor(i)).multiplyScalar(0.6).getStyle()})`; track.appendChild(seg); });
  }
  [...track.children].forEach((seg, i) => { seg.style.flexGrow = Math.max(0.0001, P[i]); });
  const name = bar.querySelector('.eb-name'), val = bar.querySelector('.eb-val'), word = bar.querySelector('.eb-word');
  let v = 0, w = '互角', c = '';
  if (evalSt.won) { w = '勝ち'; c = 'win'; }
  else if (evalSt.mate >= 0) { w = '詰み'; c = 'mate'; }
  else {
    v = Math.min(2000, Math.round(600 * Math.log(Math.max(p1, 1e-9) / Math.max(p2, 1e-9)) / 10) * 10);
    // 目安: 互角 〜+400 / 有利 +400〜 / 優勢 +1000〜 / 大優勢 +2000〜
    if (v >= 2000) { w = '大優勢'; c = 'w4'; } else if (v >= 1000) { w = '優勢'; c = 'w3'; } else if (v >= 400) { w = '有利'; c = 'w2'; }
  }
  const even = evalSt.mate < 0 && v <= 0;
  name.textContent = even ? '形勢' : draft.leaders[top];
  name.style.color = even ? '#fff' : new THREE.Color(leaderColor(top)).lerp(new THREE.Color('#fff'), 0.35).getStyle();
  val.textContent = evalSt.mate >= 0 ? '+3000' : even ? '±0' : `+${v}`;
  word.textContent = w; word.className = `eb-word ${c}`;
  // 針の宝石 = 今いちばん評価値が高い人の色(互角なら無色)。入れ替わったら光る
  const gk = even ? 'none' : `L${top}`;
  if (gk !== evalSt.gemKey) {
    evalSt.gemKey = gk;
    setHold(gk, gk !== 'none');
    if (gk !== 'none') sound.holdChange(3);
  }
  if (pulse) { bar.classList.remove('pulse'); void bar.offsetWidth; bar.classList.add('pulse'); }
}

async function pseudoSpins(list, mode) {

/* ---------------------------------------------------------------------
 *  スピン本体
 * ------------------------------------------------------------------- */
async function startSpin() {
  if (isSpinning || $('result').classList.contains('show') || !$('settings').classList.contains('hidden')) return;
  isSpinning = true;
  document.body.classList.add('spinning');
  sound.init();

  const mode = 'light';
  const { total } = MODES[mode];
  const n = draft.leaders.length;
  const arc = TAU / total;

  // ===== 抽選(本体): リーダー人数から一様に1人 =====
  // 通常は普通の抽選。?preview(演出確認モード)のときだけ、パネルで選んだ人を勝者にする
  // 埋め込み: 勝者はアプリ(サーバー)が抽選済みのものを使う
  const winner = EMBED.winner;

  // ===== ここから下は演出だけ。winner は二度と書き換えない =====
  const plan = EMBED.plan === 'zenkai' ? zenkaiPlan() : PREVIEW ? previewPlan(winner, n) : planDraft(winner, n);
  evalReset(n);
  // 止まるマス: 勝者のマスのどれか
  const landIdx = winner + n * Math.floor(Math.random() * (total / n));
  // リーチ中(PUSH待ち)は、帯が指しているリーダーのマスの中で針を止める(そのまま止まればその人)。
  // そこから勝者のマスまで passK マス進む。0 = そのまま止まる / 1 = 隣へ入る / 2以上 = 通過して入る
  const reachLead = plan.leads.length ? plan.leads[plan.leads.length - 1] : winner;
  let passK = mod(winner - reachLead, n);
  if (passK === 0 && n <= 4 && chance(0.15)) passK = n;   // たまに一周して同じ人へ戻る
  plan.donden = plan.donden && passK <= 1;                // 境目フリーズは、境目のどちら側でも決まりうるときだけ
  if (passK === 0) plan.pattern = 'stay';
  else if (passK >= 2) plan.pattern = 'pass';
  plan.passK = passK;
  const landFrac = plan.pattern === 'stay' ? rand(0.84, 0.95) : plan.pattern === 'short' ? rand(0.04, 0.12) : plan.pattern === 'pass' ? rand(0.06, 0.3) : rand(0.25, 0.7);
  const landAngle = (landIdx + landFrac) * arc;
  // 針が最後に越える境目(止まっているマスの次)
  const entryIdx = mod(landIdx - passK + 1, total);

  // 開幕: 指名者と競合数のカットイン
  flash('#fff6d0', 0.35, 0.35);
  sound.reach(2);
  cutin(draft.pick, 't-gold', { dur: 1500, gloss: 'gold', sub: `${n}チーム競合!!` });
  await sleep(1500);

  if (plan.zenkaiten) { await zenkaiten(mode, landAngle, winner); return finish(winner); }
  if (plan.ippatsu) {
    // 一発決着: 予告もリーチもなく普通に止まる → 一瞬の静寂 → ガコッ
    fx.bulb = 'spin'; fx.ambientRate = AMB_SPIN;
    sound.spinStart();
    setHold('none');
    await spinTo(landAngle, mode);
    sound.stopThud();
    fx.bulb = 'off'; fx.dimT = 0.8; fx.ambientRate = 0;
    await sleep(700);
    sound.gata(); flash('#fff', 0.6, 1); fx.shake = 1; fx.dimT = 0;
    return finish(winner);
  }
  if (plan.furigoma >= 0) await furigomaFx(plan.furigoma);

  fx.bulb = 'spin';
  fx.ambientRate = AMB_SPIN;
  sound.spinStart();
  holdVibe = false;
  setHold('none');
  const t0 = performance.now();
  sleep(600).then(() => gemAt(plan, 'start'));
  if (plan.pseudo.length) { await sleep(250); await pseudoSpins(plan.pseudo, mode); }

  const prelude = (async () => {
    await sleep(350);
    if (plan.swarm) { await sleep(150); launchSwarm(); fx.shake = Math.max(fx.shake, 0.3); }
    const wait = 1900 - (performance.now() - t0);
    if (wait > 0) await sleep(wait);
    await gemAt(plan, 'mid');
  })();

  if (plan.restart) {
    // いったん適当なマスに止まる(決まった…?) → 一瞬の間 → フリーズ → 宝石が化ける → 再始動
    const stopAngle = (Math.floor(Math.random() * total) + rand(0.25, 0.75)) * arc;
    await spinTo(stopAngle, mode);
    await prelude;
    sound.stopThud();
    await sleep(700);
    fx.bulb = 'off'; fx.dimT = 1; fx.ambientRate = 0;
    sound.freeze();
    await sleep(1700);
    sound.kyuin(); flash('#fff', 0.7, 1); fx.shake = 1.4; fx.dimT = 0;
    cutin('再抽選!!', 't-rainbow', { dur: 1200, small: true, gloss: 'rainbow' });
    await gemChange(`L${plan.gemLead}`);
    if (plan.vibe) { holdVibe = true; sound.buzz(); }
    await sleep(500);
    fx.bulb = 'spin'; fx.ambientRate = AMB_SPIN;
    sound.spinStart();
    if (await runReach(plan, mode, entryIdx, landAngle, null, winner) === 'zenkai') await zenkaiten(mode, landAngle, winner, true);
    return finish(winner);
  }
  if (await runReach(plan, mode, entryIdx, landAngle, prelude, winner) === 'zenkai') await zenkaiten(mode, landAngle, winner, true);
  return finish(winner);
}

/* ---------- 振り駒: 歩を5枚投げて、「と」の枚数で期待度を匂わせる(勝者とは無関係) ---------- */
const furi = [];
for (let i = 0; i < 5; i++) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(pieceGeo, woodMat));
  addFaces(g, PIECES.indexOf('歩'));
  g.scale.setScalar(1.6); g.visible = false;
  scene.add(g); furi.push(g);
}
let furiAnim = null;
function easeOutBounce(x) {
  const n1 = 7.5625, d1 = 2.75;
  if (x < 1 / d1) return n1 * x * x;
  if (x < 2 / d1) return n1 * (x -= 1.5 / d1) * x + 0.75;
  if (x < 2.5 / d1) return n1 * (x -= 2.25 / d1) * x + 0.9375;
  return n1 * (x -= 2.625 / d1) * x + 0.984375;
}
async function furigomaFx(tokin) {
  // どれを「と」にするかはばらばらに
  const flips = [0, 1, 2, 3, 4].sort(() => Math.random() - 0.5).slice(0, tokin);
  furiAnim = { t: 0, items: furi.map((g, i) => ({ g, delay: i * 0.09, x: (i - 2) * 1.9, back: flips.includes(i), spin: 3 + Math.floor(rand(0, 3)), land: false })) };
  furi.forEach((g) => { g.visible = true; });
  cutin('振り駒', 't-white', { dur: 900, small: true });
  sound.swarm();
  await sleep(2100);
  const t = tokin >= 5 ? 't-rainbow' : tokin >= 4 ? 't-gold' : tokin >= 2 ? 't-red' : 't-blue';
  // と が3枚以上 = 次のリーチは金以上(帯の信頼度が上がる)ので、その意味を添える
  const sub = tokin >= 5 ? 'リーチ信頼度MAX!!' : tokin >= 3 ? 'リーチ信頼度UP!' : '';
  cutin(`と ×${tokin}`, t, { dur: sub ? 1500 : 1100, small: true, gloss: tokin >= 2 ? (tokin >= 5 ? 'rainbow' : tokin >= 4 ? 'gold' : 'red') : null, sub });
  if (tokin >= 3) { flash('#fff', 0.4, 0.6); fx.shake = 0.8; sound.holdChange(tokin); }
  await sleep(sub ? 1700 : 1300);
  furiAnim = null;
  furi.forEach((g) => { g.visible = false; });
}
function updateFuri(dt) {
  if (!furiAnim) return;
  furiAnim.t += dt;
  for (const it of furiAnim.items) {
    const s = Math.min(1, Math.max(0, (furiAnim.t - it.delay) / 1.15));
    const y = 9 + (-1.2 - 9) * easeOutBounce(s);
    it.g.position.set(it.x * (0.6 + 0.4 * s), y, 4.5);
    const fin = it.back ? Math.PI : 0;
    it.g.rotation.set((1 - s) * it.spin * 2.3, fin + (1 - s) * it.spin * TAU, (1 - s) * 1.5);
    if (s >= 1 && !it.land) { it.land = true; sound.stopThud(); }
  }
}

/* ---------------------------------------------------------------------
 *  全回転(超レア・確定): ブラックアウト → キュイン → 盤に寄りながら高速回転し、
 *  マスが1つずつ全部「終了」に変わる。元ネタはパチンコの全回転リーチ(回り出したら当たり確定)
 * ------------------------------------------------------------------- */
let zenOverlay = null;
function buildZenOverlay(mode, winner) {
  removeZenOverlay();
  const { total } = MODES[mode];
  const arc = TAU / total;
  const tex = drawWheel(mode, winner);
  const mat = new THREE.MeshStandardMaterial({ map: tex.map, emissiveMap: tex.emissive, emissive: 0xffffff, emissiveIntensity: 0.35, roughness: 0.42, metalness: 0.1, polygonOffset: true, polygonOffsetFactor: -2 });
  const g = new THREE.Group();
  const segs = Math.max(4, Math.round(256 / total));
  for (let i = 0; i < total; i++) {
    if (leaderOf(i) === winner) continue;
    // CircleGeometry の扇形は盤面テクスチャと同じ角度・UV で切り出せる
    const m = new THREE.Mesh(new THREE.CircleGeometry(R, segs, i * arc, arc), mat);
    m.position.z = 0.205; m.visible = false; m.userData.i = i;
    g.add(m);
  }
  spinner.add(g);
  zenOverlay = { g, mat, tex };
}
function removeZenOverlay() {
  if (!zenOverlay) return;
  spinner.remove(zenOverlay.g);
  zenOverlay.g.children.forEach((m) => m.geometry.dispose());
  zenOverlay.mat.dispose(); zenOverlay.tex.map.dispose(); zenOverlay.tex.emissive.dispose();
  zenOverlay = null;
}
const zP = new THREE.Vector3(), zC = new THREE.Color();
// 盤のふちから、回転方向(時計回り)に渦を巻いて飛ぶ虹の粒
function emitZenkai(dt) {
  const n = Math.floor(110 * dt + Math.random());
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    zP.set(Math.cos(a) * (R + 0.35), Math.sin(a) * (R + 0.35), 0.5);
    wheelRoot.localToWorld(zP);
    const sp = rand(5, 11);
    zC.setHSL(Math.random(), 1, 0.55).multiplyScalar(2.2);
    sparks.emit(zP.x, zP.y, zP.z, Math.sin(a) * sp + Math.cos(a) * 2, -Math.cos(a) * sp + Math.sin(a) * 2, rand(0, 3), zC, rand(0.15, 0.42), rand(0.6, 1.4), -2, 0.96);
  }
}
// 変わったマスから噴き出す粒
function sliceBurst(i, arc) {
  const mid = (i + 0.5) * arc;
  zP.set(Math.cos(mid) * R * 0.7, Math.sin(mid) * R * 0.7, 0.4);
  spinner.localToWorld(zP);
  for (let k = 0; k < 36; k++) {
    const a = rand(0, TAU), sp = rand(3, 9);
    zC.setHSL(k % 3 ? 0.12 : Math.random(), 1, 0.6).multiplyScalar(2.4);
    sparks.emit(zP.x, zP.y, zP.z + 0.3, Math.cos(a) * sp, Math.sin(a) * sp, rand(1, 5), zC, rand(0.15, 0.4), rand(0.5, 1.1), -4, 0.95);
  }
}
async function zenkaiten(mode, landAngle, winner, fromReach = false) {
  const { total } = MODES[mode];
  const winIndex = winner;
  const arc = TAU / total;
  if (!fromReach) {
    // 1) いつもどおり回り始める
    setHold('none');
    fx.bulb = 'spin'; fx.ambientRate = AMB_SPIN;
    sound.spinStart();
    flash('#fff6d0', 0.35, 0.35);
    const a0 = phi;
    await play([
      { dur: 0.7, p0: a0, p1: a0 + 3, ease: E.in2 },
      { dur: 1.3, p0: a0 + 3, p1: a0 + 14.1, ease: (x) => x },
    ]);
    // 2) ブラックアウト: 急ブレーキ → 暗転・無音
    sound.freeze();
    fx.bulb = 'off'; fx.dimT = 1; fx.ambientRate = 0;
    const b0 = phi;
    await play([{ dur: 0.6, p0: b0, p1: b0 + 1.7, ease: E.outCubic }]);
  }
  buildZenOverlay(mode, winner); // 暗転中に準備(ここで少し重くても見えない)
  await sleep(1300);
  // 3) キュイン → 宝石が虹 → 盤へ寄る
  sound.kyuin(); flash('#fff', 0.8, 1); fx.shake = 1.6; fx.dimT = 0;
  setHold(`L${winner}`, true); setTier('rainbow');
  evalMate(winner);
  // 盤に寄ると発光部分が画面いっぱいになって白飛びするので、全回転中は盤の光を控えめにする
  fx.reachT = 0.6; fx.winT = 0.2; fx.bulb = 'win'; fx.cam = 'zenkai'; fx.zenkai = true; fx.faceGlowT = 0.7;
  document.body.classList.add('reaching');
  cutin('全回転', 't-rainbow', { dur: 1700, gloss: 'rainbow', huge: true });
  // 4) 高速回転(速さが途切れないように 加速 / 一定 / 減速 で距離を配分) しながら全マスが終了に変わる
  const c0 = phi, Ta = 0.8, Tc = 4.4, Td = 3.6;
  const phiF = phiFor(landAngle, c0 + 55, 0);
  const v = (phiF - c0) / (Ta / 2 + Tc + Td / 3);
  const motion = play([
    { dur: Ta, p0: c0, p1: c0 + v * Ta / 2, ease: E.in2 },
    { dur: Tc, p0: c0 + v * Ta / 2, p1: c0 + v * (Ta / 2 + Tc), ease: (x) => x },
    { dur: Td, p0: c0 + v * (Ta / 2 + Tc), p1: phiF, ease: E.outCubic },
  ]);
  await sleep(Ta * 1000 + 200);
  // 針の位置から順番に、ぐるっと一周するように変える(闇は10マスずつ)
  const order = [];
  for (let k = 1; k < total; k++) { const i = mod(winIndex + k, total); if (leaderOf(i) !== winner) order.push(i); }
  const waves = Math.min(order.length, 10);
  const per = Math.ceil(order.length / waves);
  for (let w = 0; w < waves; w++) {
    const group = order.slice(w * per, (w + 1) * per);
    for (const m of zenOverlay.g.children) if (group.includes(m.userData.i)) { m.visible = true; sliceBurst(m.userData.i, arc); }
    sound.holdChange(Math.min(5, Math.floor(w / 2)));
    flash('#fff', 0.2, 0.35); fx.shake = Math.max(fx.shake, 0.5);
    await sleep(360);
  }
  sound.kakutei(); flash('#fff', 0.6, 0.9); fx.shake = 1.2;
  await motion;
  fx.zenkai = false;
  sound.stopThud();
}

// リーチなしの回転(加速→長いブレーキ)
const SPIN_TIME = 0.7 + 5.0;
function spinTo(angle, mode) {
  const phi0 = phi, Ta = 0.7;
  const phiF = phiFor(angle, phi0, mode === 'light' ? 6 : 5);
  const D = phiF - phi0;
  const Da = D / 3.857, Td = 5.0;
  return play([
    { dur: Ta, p0: phi0, p1: phi0 + Da, ease: E.in2 },
    { dur: Td, p0: phi0 + Da, p1: phiF, ease: E.outQuint },
  ]);
}

// リーチ演出つきの回転(今の位置から回し始める)
async function runReach(plan, mode, entryIdx, landAngle, prelude, winner) {
  const { total } = MODES[mode];
  const arc = TAU / total, n = draft.leaders.length;
  // 評価値で一人勝ちしている人がいるときは、その人だけでリーチする(寝返りで対抗馬を急に作らない)。
  // 針はその人のマスで止まり、勝者が別ならそこから動き出す
  const P0 = evalSt.P || [];
  const top = P0.length ? P0.indexOf(Math.max(...P0)) : -1;
  let soloLead = -1;
  if (plan.reachZenkai) {
    // リーチから全回転: リーチは勝者以外(評価値トップが勝者でなければその人)。全回転で別の人に逆転確定する
    let x = top >= 0 && top !== winner ? top : -1;
    if (x < 0) { do { x = Math.floor(Math.random() * n); } while (x === winner); }
    plan.heatPath = ['normal']; plan.heat = 'normal'; plan.donden = false;
    soloLead = x;
  } else if (top >= 0 && evalOf(top) >= 600 && plan.heat !== 'rainbow') soloLead = top;
  if (soloLead >= 0) {
    plan.leads = [soloLead];
    plan.solo = true;
    const passK = mod(winner - soloLead, n);
    const landIdx = Math.floor(landAngle / arc);
    if (passK === 0) { plan.pattern = 'stay'; landAngle = (landIdx + rand(0.84, 0.95)) * arc; }
    else if (passK >= 2) { plan.pattern = 'pass'; landAngle = (landIdx + rand(0.06, 0.3)) * arc; }
    else if (plan.pattern === 'stay' || plan.pattern === 'pass') { plan.pattern = 'straight'; landAngle = (landIdx + rand(0.25, 0.7)) * arc; }
    plan.passK = passK;
    plan.donden = plan.donden && passK <= 1;
    entryIdx = mod(landIdx - passK + 1, total);
  }
  const winIndex = entryIdx; // 針が最後に越える境目(このマスの入口)
  const phi0 = phi, Ta = 0.7;
  // 境目フリーズはリーチの時点で境目ギリギリまで迫って止める(あとからもう一度近づかない)
  const holdGap = plan.donden ? rand(0.015, 0.04) : 0.5;
  const creepDist = 1.3 * arc;
  const Tc = 3.2, Td = 4.3;
  const phiB = phiFor(winIndex * arc, phi0 + creepDist + holdGap * arc, 5); // 境目が針に来る φ
  const phiHold = phiB - holdGap * arc;
  const phiPre = phiHold - creepDist;
  const Dm = phiPre - phi0;
  const Da = Dm / 5.725, Dd = Dm - Da;
  const vc = 1.6 * creepDist / Tc;
  const mainDone = play([
    { dur: Ta, p0: phi0, p1: phi0 + Da, ease: E.in2 },
    { dur: Td, p0: phi0 + Da, p1: phiPre, ease: E.herm(2.6, vc * Td / Dd) },
    { dur: Tc, p0: phiPre, p1: phiHold, ease: E.herm(1.6, 0) },
  ]);

  // リーチの帯: 熱さ(heatPath) と 指すリーダー(leads) が途中で変わることがある
  const heats = plan.heatPath;
  let leads = plan.leads;
  let stepsN = Math.max(heats.length, leads.length);
  const at = (i) => ({ heat: heats[Math.min(i, heats.length - 1)], lead: leads[Math.min(i, leads.length - 1)] });
  const reachText = '抽選リーチ';
  const showReach = (st, dur, upgrade) => {
    const key = heatTier(st.heat, st.lead);
    const t = TIERS[key], col = leaderColor(st.lead);
    setTier(key);
    vignette(col, true);
    const cls = st.heat === 'normal' ? 't-lead' : t.cls;
    cutin(reachText, cls, { dur, gloss: st.heat === 'normal' ? 'gold' : t.gloss, sub: draft.leaders[st.lead], color: st.heat === 'normal' ? col : null });
    if (upgrade) { sound.upgrade(); flash('#fff', 0.45, 1); fx.shake = 1.2; }
    if (st.heat === 'rainbow') sound.kakutei();
    evalSignal(st.lead, REACH_REL[st.heat]);
  };

  // ステップアップはリーチの直前に終わるように出す
  const sd = stepDuration(plan.steps);
  const tReach = (Ta + Td - 0.9) * 1000;
  await sleep(Math.max(300, tReach - sd));
  if (prelude) await prelude;
  await stepUp(plan.steps);
  fx.reachT = 1; fx.bulb = 'reach'; fx.cam = 'reach'; fx.faceGlowT = 1.6;
  document.body.classList.add('reaching');
  const hb = setInterval(() => sound.heartbeat(), 820);
  if (plan.gimmick) { dropGimmick(); await sleep(1000); }
  flash(leaderColor(at(0).lead), 0.5, 0.7);
  fx.shake = Math.max(fx.shake, 0.6);
  sound.reach(2 + HEAT_ORDER.indexOf(at(0).heat));
  // 最初のリーチは、その時点で評価値がいちばん高い人。最後に指す人(本命の抽選結果)が違えば、途中で寝返る
  const P = evalSt.P || [];
  const topNow = P.length ? P.indexOf(Math.max(...P)) : -1;
  const finalLead = leads[leads.length - 1];
  if (!plan.solo && topNow >= 0 && P.some((v) => Math.abs(v - P[topNow]) > 1e-6)) {
    leads = topNow === finalLead ? [finalLead] : [topNow, finalLead];
    stepsN = Math.max(heats.length, leads.length);
  }
  showReach(at(0), 1600, false);
  if (plan.gekiatsu) setTimeout(() => cutin('激熱', 't-red', { dur: 1300, gloss: 'red', big: true }), 1650);

  // リーチ中: 宝石の変化と、帯の変化(熱さの昇格・指す人の寝返り)
  const during = (async () => {
    await sleep(700);
    await gemAt(plan, 'reach');
    let gemDone = false;
    for (let i = 1; i < stepsN; i++) {
      await sleep(stepsN > 2 ? 950 : 1500);
      if (!gemDone) { await gemAt(plan, 'creep'); gemDone = true; }
      showReach(at(i), 1100, true);
    }
    if (!gemDone) { await sleep(700); await gemAt(plan, 'creep'); }
  })();

  await mainDone;
  await during;
  fx.bulb = 'hold';
  tremble = Math.min(0.12 * arc, 0.01, holdGap * arc * 0.4);   // 境目ギリギリのときは震えで越えないように

  // リーチ中のフリーズ(確定) / 全回転への移行
  if (plan.reachFreeze || plan.reachZenkai) {
    await sleep(600);
    clearInterval(hb); tremble = 0;
    fx.bulb = 'off'; fx.dimT = 1; fx.ambientRate = 0; vignette(null, false);
    sound.freeze();
    if (plan.reachZenkai) return 'zenkai';
    await sleep(1900);
    sound.kyuin(); flash('#fff', 0.8, 1); fx.shake = 1.5; fx.dimT = 0;
    showReach({ heat: 'rainbow', lead: winner }, 1500, false);
    plan.push = false; plan.mash = false; plan.heat = 'rainbow';
    await sleep(1200);
  }

  const finalHeat = plan.heat;
  if (plan.push) {
    await waitPush(finalHeat === 'normal' ? 'red' : finalHeat, plan.vibe, plan.mash);
    sound.pushHit(); flash(leaderColor(at(stepsN - 1).lead), 0.4, 0.8); fx.shake = 0.8;
  } else await sleep(900);
  clearInterval(hb);
  tremble = 0;
  await gemAt(plan, 'push');

  // 境目(phiB)から見た止まる位置。stay は境目の手前、pass は越えた先のマス
  const landFrac = mod(landAngle / arc, 1);
  const target = phiB + (plan.passK - 1 + landFrac) * arc;

  if (plan.donden) {
    // 境目フリーズ: 2人の境目ギリギリで止まりかけ → 暗転・無音で震える(どっちだ…!?) → どちらかに決まる
    const edge = phiHold;   // リーチの時点で境目ギリギリに止まっている
    // 無音のまま、針の先へ吸い込まれるようにカメラが寄る
    fx.edgeK = 0; fx.edgeT = 1; fx.edgeRate = 1.4;
    await sleep(900);
    fx.bulb = 'off'; fx.dimT = 0.85; fx.ambientRate = 0; vignette(null, false);
    tremble = 0.012 * arc;   // 無音のまま震える
    await sleep(2000);
    tremble = 0;
    sound.gata(); flash('#fff', 0.5, 1); fx.shake = 1.3; fx.dimT = 0; fx.bulb = 'reach';
    fx.edgeT = 0; fx.edgeRate = 3;
    // 勝者が手前の人ならそのまま、次の人ならコトッと境目を越える
    if (plan.passK >= 1) await play([{ dur: 0.45, p0: edge, p1: target, ease: E.outCubic }]);
    else await sleep(300);
  } else if (plan.pattern === 'stay') {
    // 境目へじわじわ迫って…そのまま止まる
    await play([{ dur: 2.2, p0: phiHold, p1: target, ease: E.outCubic }]);
  } else if (plan.pattern === 'straight') {
    await play([{ dur: 1.1, p0: phiHold, p1: target, ease: E.inOut3 }]);
  } else if (plan.pattern === 'revive') {
    // いったん手前で止まる → 静寂 → ガタッ → 動く
    const shortP = phiB - rand(0.06, 0.14) * arc;
    await play([{ dur: 1.0, p0: phiHold, p1: shortP, ease: E.inOut3 }]);
    sound.stopThud();
    fx.bulb = 'off'; fx.dimT = 0.85; fx.reachT = 0.2; vignette(null, false);
    tremble = 0.02 * arc;
    await sleep(1700);
    tremble = 0;
    sound.gata(); flash('#fff', 0.5, 1); fx.shake = 1.4; fx.dimT = 0; fx.bulb = 'reach';
    await play([{ dur: 0.5, p0: shortP, p1: target, ease: E.outCubic }]);
  } else if (plan.pattern === 'short') {
    await play([{ dur: 1.8, p0: phiHold, p1: target, ease: E.inOut3 }]);
  } else { // pass
    // 通過するマスが多いほど長く
    await play([{ dur: Math.min(6, 2.2 + 0.9 * (plan.passK - 2)), p0: phiHold, p1: target, ease: E.inOut3 }]);
  }
  sound.stopThud();
}

function setTier(key) {
  fx.tierKey = key;
  fx.tier.set(TIERS[key].hex);
  fx.ambientRate = ambForTier(key);
}

async function finish(winner) {
  fx.edgeK = 0; fx.edgeT = undefined;
  evalWin(winner);
  const mode = 'light';
  phi = mod(phi, TAU);
  lastSector = -1;
  fx.reachT = 0; fx.cam = 'win';
  vignette(null, false);
  holdVibe = false;
  document.body.classList.remove('reaching');
  fx.winT = 1; fx.bulb = 'win'; fx.dimT = 0; fx.faceGlowT = 2.2; fx.ambientRate = AMB_WIN;
  sound.kyuin();
  setTimeout(() => sound.win(mode), 250);
  flash('#fff', 0.8, 1);
  fx.shake = 1.6;
  burst(mode, 450);
  launchConfetti(mode, 300);
  setTimeout(() => { if (fx.winT) { burst(mode, 250); launchConfetti(mode, 150); } }, 900);
  setTimeout(() => { if (fx.winT) launchConfetti(mode, 150); }, 1900);
  await sleep(350);
  showResult(winner);
  parent.postMessage({ type: 'roulette-done', id: EMBED.id }, '*');
  isSpinning = false;
  document.body.classList.remove('spinning');
}

function burst(mode, n) {
  const cols = mode === 'light'
    ? [new THREE.Color(2.2, 1.6, 0.5), new THREE.Color(2, 2, 2), new THREE.Color(2.4, 0.6, 0.3)]
    : [new THREE.Color(1.5, 0.35, 2.4), new THREE.Color(2.4, 0.3, 0.8), new THREE.Color(1.6, 1.6, 2.2)];
  const p = new THREE.Vector3(); face.getWorldPosition(p);
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(4, 16), up = rand(-0.2, 1);
    sparks.emit(p.x, p.y, p.z + 1, Math.cos(a) * sp, Math.sin(a) * sp + up * 3, rand(-2, 6),
      cols[i % cols.length], rand(0.15, 0.45), rand(1.2, 2.6), -7, 0.965);
  }
}

const camPos = new THREE.Vector3(0, 0, 30), camLook = new THREE.Vector3();
const tmpV = new THREE.Vector3(), tmpL = new THREE.Vector3();
function baseCamDist() {
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const half = R + 1.3;
  if (safeArea) return Math.max(half / (0.75 * 0.82) / t, half / 0.9 / (t * camera.aspect));
  if (vertical) return Math.max(half / 0.8 / t, half / 0.94 / (t * camera.aspect));
  return Math.max(half / 0.7 / t, half / 0.92 / (t * camera.aspect));
}
function camTarget(out, look) {
  const d = baseCamDist();
  if (fx.cam === 'reach') {
    const p = pointerPivot.getWorldPosition(ptrPos);
    // edgeK(0〜1): 境目フリーズで針の先へ吸い込まれるように寄る
    const e = fx.edgeK || 0;
    const close = 0.62 + (0.13 - 0.62) * e;
    out.set(Math.sin(time * 0.4) * 0.6 * (1 - e), p.y - 2.2 + 1.05 * e, d * close);
    look.set(0, p.y - 1.4 + 0.25 * e, 0);
  } else if (fx.cam === 'zenkai') {
    // 盤面すれすれまで寄って、ゆっくり回り込む
    const a = time * 0.55;
    out.set(Math.sin(a) * d * 0.16, -R * 0.55 + Math.cos(a * 0.7) * 0.7, d * 0.3);
    look.set(Math.sin(a) * 0.6, R * 0.12, 0);
  } else if (fx.cam === 'win') {
    const a = Math.sin(time * 0.5) * 0.22;
    out.set(Math.sin(a) * d * 0.92, -0.4 + Math.sin(time * 0.7) * 0.4, Math.cos(a) * d * 0.92);
    look.set(0, 0, 0);
  } else {
    out.set(Math.sin(time * 0.23) * 0.5, -0.6 + Math.sin(time * 0.31) * 0.2, d);
    look.set(0, -0.15, 0);
  }
}

 *  毎フレーム
