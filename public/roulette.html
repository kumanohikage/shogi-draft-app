const bulbCol = new THREE.Color();
const BASE_BULB = { light: new THREE.Color(3.2, 2.2, 0.7), dark: new THREE.Color(1.6, 0.35, 3.2) };
function updateBulbs() {
  const base = BASE_BULB[currentMode];
  for (let i = 0; i < BULBS; i++) {
    switch (fx.bulb) {
      case 'idle': {
        const on = (i + Math.floor(time * 7)) % 6 < 2;
        bulbCol.copy(base).multiplyScalar(on ? 1 : 0.12); break;
      }
      case 'spin': {
        const on = (i + Math.floor(time * 28)) % 4 === 0;
        bulbCol.copy(base).multiplyScalar(on ? 1.3 : 0.2); break;
      }
      case 'reach': {
        const on = (i + Math.floor(time * 8)) % 2 === 0;
        tierBulb(bulbCol, i).multiplyScalar(on ? 1.4 : 0.08); break;
      }
      case 'hold': tierBulb(bulbCol, i).multiplyScalar(0.7 + 0.6 * Math.abs(Math.sin(time * 9))); break;
      case 'win': bulbCol.setHSL(mod(i / BULBS + time * 0.9, 1), 1, 0.5).multiplyScalar(3.5 * (0.6 + 0.4 * ((i + Math.floor(time * 12)) % 2))); break;
      default: bulbCol.setRGB(0.03, 0.03, 0.03);
    }
    bulbs.setColorAt(i, bulbCol);
  }
  bulbs.instanceColor.needsUpdate = true;
}
function tierBulb(c, i) {
  if (fx.tierKey === 'rainbow') return c.setHSL(mod(i / BULBS * 2 + time * 1.5, 1), 1, 0.5).multiplyScalar(3);
  if (fx.tierKey === 'zebra') return c.setScalar((i + Math.floor(time * 10)) % 2 ? 3 : 0.04);
  return c.copy(fx.tier).multiplyScalar(3);
}

const AMB = { light: new THREE.Color(2.4, 1.7, 0.6), red: new THREE.Color(2.4, 0.2, 0.5), dark: new THREE.Color(1.3, 0.4, 2.6) };
const ptrPos = new THREE.Vector3(), reachCol = new THREE.Color(), shakeV = new THREE.Vector3(), camDir = new THREE.Vector3();
function emitAmbient(dt) {
  // 急に増減しないよう、なめらかに追従させる
  fx.ambNow += (fx.ambientRate * (pushResolve ? 1.6 : 1) - fx.ambNow) * (1 - Math.exp(-dt * 2.5));
  const rate = 26 * fx.ambNow;
  let n = rate * dt; const vw = viewHalfWidth();
  while (n > 0) {
    if (Math.random() < n) {
      if (currentMode === 'light') {
        sparks.emit(camLook.x + rand(-vw, vw), camLook.y - viewHalfHeight() * 1.3, rand(-6, 3), rand(-0.3, 0.3), rand(1, 2.6), 0,
          AMB.light, rand(0.12, 0.32), rand(5, 9), 0, 1);
      } else {
        const red = Math.random() < 0.2;
        sparks.emit(camLook.x + rand(-vw, vw), camLook.y - viewHalfHeight() * 1.3, rand(-6, 3), rand(-0.5, 0.5), rand(0.8, 2.2), 0,
          red ? AMB.red : AMB.dark, rand(0.1, 0.3), rand(5, 9), 0, 1);
      }
    }
    n -= 1;
  }
}

function emitReach(dt) {
  if (fx.reach < 0.5) return;
  const p = pointerPivot.getWorldPosition(ptrPos);
  const n = Math.floor(30 * dt + Math.random());
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU);
    const c = fx.tierKey === 'rainbow' ? reachCol.setHSL(Math.random(), 1, 0.5).multiplyScalar(2) : reachCol.copy(fx.tier).multiplyScalar(1.6);
    sparks.emit(p.x + Math.cos(a) * 0.4, p.y - 1.1, p.z + 0.3, Math.cos(a) * rand(1, 4), Math.sin(a) * rand(1, 4), rand(0, 2), c, rand(0.15, 0.35), rand(0.5, 1.1), 0, 0.95);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;

  stepMotion(now);
  const disp = phi + (tremble ? Math.sin(time * 47) * tremble : 0);
  spinner.rotation.z = -disp;
  angVel = Math.abs(disp - prevDisp) / Math.max(dt, 1e-4); prevDisp = disp;

  // 針とチック音
  const { total } = MODES[currentMode];
  const sec = Math.floor(mod(Math.PI / 2 + disp, TAU) / (TAU / total));
  if (sec !== lastSector) {
    if (lastSector !== -1 && isSpinning) {
      flick = Math.min(0.45, flick + 0.28);
      if (now - lastTickAt > 28) { lastTickAt = now; sound.tick(Math.min(1.4, 0.75 + angVel * 0.03)); }
    }
    lastSector = sec;
  }
  flick += (0 - flick) * Math.min(1, dt * 16);
  pointerPivot.rotation.z = flick;
  pointerPivot.userData.gem.rotation.y += dt * 2;
  updateGem(dt);

  // 演出パラメータをなめらかに
  const k = (rate) => 1 - Math.exp(-dt * rate);
  fx.reach += (fx.reachT - fx.reach) * k(4);
  fx.win += (fx.winT - fx.win) * k(3);
  fx.dim += (fx.dimT - fx.dim) * k(6);
  fx.dark += ((currentMode === 'dark' ? 1 : 0) - fx.dark) * k(5);
  fx.faceGlow += (fx.faceGlowT - fx.faceGlow) * k(4);
  fx.shake *= Math.exp(-dt * 3.2);

  bgUniforms.uTime.value = time;
  bgUniforms.uDark.value = fx.dark;
  bgUniforms.uReach.value = fx.reach;
  bgUniforms.uWin.value = fx.win;
  bgUniforms.uDim.value = fx.dim;
  // 粒ほど極端にせず、通常 0.43 → 虹のPUSH待ち 1.0 くらいの幅で追従
  bgUniforms.uGlow.value = 0.4 + 0.6 * Math.min(1, fx.ambNow / 3.4);
  if (fx.tierKey === 'rainbow') bgUniforms.uTier.value.setHSL(mod(time * 0.5, 1), 1, 0.5);
  else bgUniforms.uTier.value.copy(fx.tier);

  faceMat.emissiveIntensity = 0.55 * fx.faceGlow * (fx.bulb === 'off' ? 0.25 : 1) * (fx.reach > 0.5 ? 0.85 + 0.35 * Math.sin(time * 10) : 1);
  tierLight.intensity = fx.reach * 8 + fx.win * 12;
  if (fx.win > 0.01) tierLight.color.setHSL(mod(time * 0.4, 1), 1, 0.6); else tierLight.color.copy(bgUniforms.uTier.value);
  bloom.strength = 0.45 + fx.reach * 0.25 + fx.win * 0.45;

  updateBulbs();
  emitAmbient(dt);
  emitReach(dt);
  if (fx.win > 0.5 && Math.random() < dt * 12) burst(currentMode, 8);
  sparks.update(dt);
  updateConfetti(dt);
  updateSwarm(dt);
  updateGimmick(dt);
  updateFuri(dt);
  if (fx.zenkai) emitZenkai(dt);
  if (zenOverlay) zenOverlay.mat.emissiveIntensity = fx.zenkai ? 0.3 + 0.2 * Math.abs(Math.sin(time * 8)) : 0.55 * fx.faceGlow;

  // カメラ
  camTarget(tmpV, tmpL);
  const cr = fx.cam === 'reach' ? (fx.edgeK > 0 ? 5 : 2.0) : fx.cam === 'zenkai' ? 1.7 : 2.6;
  if (fx.edgeT !== undefined) fx.edgeK += (fx.edgeT - (fx.edgeK || 0)) * (1 - Math.exp(-dt * fx.edgeRate));
  camPos.lerp(tmpV, k(cr)); camLook.lerp(tmpL, k(cr));
  camera.position.copy(camPos);
  if (fx.shake > 0.01) camera.position.add(shakeV.set(rand(-1, 1), rand(-1, 1), 0).multiplyScalar(fx.shake * 0.35));
  camera.lookAt(camLook);

  // 背景板をカメラの奥に貼る
  bg.position.copy(camera.position).add(camera.getWorldDirection(camDir).multiplyScalar(60));
  bg.quaternion.copy(camera.quaternion);
  const h = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 60 * 1.5;
  bg.scale.set(h * camera.aspect, h, 1);

  composer.render();
  requestAnimationFrame(frame);
}

// ?layout=vertical / ?layout=horizontal で固定。無ければ窓の形で自動
const forcedLayout = new URLSearchParams(location.search).get('layout');
let vertical = false, safeArea = false;
const TOUCH = matchMedia('(hover: none) and (pointer: coarse)').matches;
if (TOUCH) document.body.classList.add('touch');
function layoutStage() {
  const st = $('stage');
  const ww = window.innerWidth, wh = window.innerHeight;
  vertical = forcedLayout === 'vertical' ? true : forcedLayout === 'horizontal' ? false : wh > ww;
  const fixed = forcedLayout === 'vertical' || forcedLayout === 'horizontal';
  const bw = vertical ? 1080 : 1920, bh = vertical ? 1920 : 1080;
  const sc = Math.min(ww / bw, wh / bh);
  // 固定: 16:9 / 9:16 の舞台に黒帯。自由: 窓いっぱい(部品の大きさの基準だけ揃える)
  // iPhone のホームバーなど画面下の安全領域ぶん、UI(舞台)だけ上に詰める(ルーレットの絵は画面いっぱいのまま)
  const inset = fixed ? 0 : $('safe-probe').offsetHeight;
  const sw = fixed ? bw : ww / sc, sh = fixed ? bh : (wh - inset) / sc;
  const w = fixed ? Math.round(sw * sc) : ww, h = fixed ? Math.round(sh * sc) : wh;
  // タッチ端末では UI の実寸がおよそ等倍になるように拡大(縮みすぎ対策)
  st.style.setProperty('--uiz', TOUCH ? Math.min(3.2, Math.max(1, (vertical ? 0.74 : 0.58) / sc)).toFixed(3) : '1');
  const x = Math.floor((ww - w) / 2), y = Math.floor((wh - h) / 2);
  st.style.width = `${sw}px`; st.style.height = `${sh}px`;
  st.style.setProperty('--vw', `${sw / 100}px`); st.style.setProperty('--vh', `${sh / 100}px`);
  st.style.transform = `translate(${x}px, ${y}px) scale(${sc})`;
  Object.assign(canvas.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });
  document.body.classList.toggle('vertical', vertical);
  document.body.classList.toggle('safe', vertical && fixed);
  safeArea = vertical && fixed;
  return { w, h };
}

function resize() {
  const { w, h } = layoutStage();
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  // 縦: 盤を上 75% の中央(=上から 37.5%)に寄せる。下はチャットが重なる余白
  if (safeArea) camera.setViewOffset(w, h, 0, h * 0.125, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  bgUniforms.uAspect.value = w / h;
  sparks.uniforms.uScale.value = (h * renderer.getPixelRatio()) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}

/* ---------- 重さの診断: ブラウザ側の設定で重くなっているときだけ、直し方を出す(画質は下げない) ---------- */
function checkPerf() {
  let soft = false;
  try {
    const gl = renderer.getContext(), ext = gl.getExtension('WEBGL_debug_renderer_info');
    const name = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '';
    soft = /swiftshader|basic render|llvmpipe|software/i.test(name);
  } catch (_) { /* 取れなくても続行 */ }
  if (soft) return showPerfTip('soft');
  // 待機中のコマ数を4秒数える(起動直後は文字の準備で一時的に落ちるので、10秒待ってから)。40未満なら省エネモードなどの制限
  setTimeout(() => {
    if (isSpinning || document.hidden) return;
    let n = 0; const t0 = performance.now();
    const count = (t) => { n++; if (t - t0 < 4000) requestAnimationFrame(count); else if (n / 4 < 40 && !isSpinning && !document.hidden) showPerfTip('slow'); };
    requestAnimationFrame(count);
  }, 10000);
}
function showPerfTip(kind) {
  try { if (localStorage.getItem('perfTipHidden')) return; } catch (_) { /* 同上 */ }
  const el = document.createElement('div');
  el.id = 'perftip';
  el.innerHTML = kind === 'soft'
    ? '<b>動きが重いときは</b>：ブラウザのグラフィック アクセラレーションがオフになっています。Chrome なら <code>設定 → システム →「グラフィック アクセラレーションが使用可能な場合は使用する」</code> をオンにして再起動してください。'
    : '<b>動きが重いときは</b>：ブラウザの省エネ機能でコマ数が制限されているかもしれません。Chrome なら <code>設定 → パフォーマンス →「省エネモード」</code> をオフ、またはグラフィック アクセラレーションをオンにしてください。';
  const x = document.createElement('button'); x.textContent = '✕'; x.title = '今後表示しない';
  x.onclick = () => { el.remove(); try { localStorage.setItem('perfTipHidden', '1'); } catch (_) { /* 同上 */ } };
  el.appendChild(x);
  document.body.appendChild(el);
}

/* ---------- 設定パネル: 入力欄から離れたとき・画像を変えたときに自動で保存して盤に反映 ---------- */
let editImg = null;           // パネルで扱っている画像(保存前でも表示用)
// OBS のブラウザソース内(window.obsstudio がある)では、日本語入力できない旨を出す
if (window.obsstudio) $('st-obs').hidden = false;
// バージョン(本番に出すたびに上げる)。確認用(/dev/)では目印を出す
/* ---------------------------------------------------------------------
 *  演出確認モード(URL に ?preview)。勝者と演出を選んで回せる

const EMBED = { id: null, winner: 0 };
let embedQueue = Promise.resolve();
window.addEventListener('message', (e) => {
  const m = e.data || {};
  embedQueue = embedQueue.then(async () => {
    if (m.type === 'setup') {
      if (isSpinning) return;
      closeResult();
      draft = { pick: m.pick, leaders: m.leaders, image: m.image || '', crop: { x: 0, y: 0, zoom: 1 }, colors: m.colors, imgBg: '' };
      await document.fonts.load("100px 'Dela Gothic One'", m.leaders.join('') + m.pick).catch(() => {});
      await loadDraftImage();
      glossCache.clear();
      setMode('light', true);
      warmGlossy();
    } else if (m.type === 'spin') {
      if (isSpinning) return;
      closeResult();
      EMBED.id = m.id; EMBED.winner = m.winner; EMBED.plan = m.plan || '';
      startSpin();
    } else if (m.type === 'volume') {
      window.__embedVol = m.v;
      if (sound.master && !window.__embedSilent) sound.master.gain.value = 0.75 * m.v;
    } else if (m.type === 'silence') {
      // ルーレット以外の画面のときは音を消す(演出はそのまま進む)。戻ったら音量を戻す
      if (!!m.on === !!window.__embedSilent) return;
      window.__embedSilent = !!m.on;
      if (sound.master && sound.ctx) {
        const g = sound.master.gain, t = sound.ctx.currentTime;
        g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
        g.linearRampToValueAtTime(m.on ? 0 : 0.75 * (window.__embedVol ?? 1), t + 0.4);
      }
    } else if (m.type === 'reset') {
      if (!isSpinning) closeResult();
    }
  });
});

  };
}

async function commitForm() {

  let err = '';
  if (leaders.length < 2) err = 'リーダーは2人以上入れてください(この欄はまだ保存していません)';
  else if (new Set(leaders).size !== leaders.length) err = '同じ名前のリーダーがいます(この欄はまだ保存していません)';
  else if (leaders.length > LEADER_COLORS.length) err = `リーダーは${LEADER_COLORS.length}人までです(この欄はまだ保存していません)`;
  const nextLeaders = err ? draft.leaders : leaders;

  $('st-msg').textContent = err;
  const changed = pick !== draft.pick || nextLeaders.join('\n') !== draft.leaders.join('\n');
  if (!changed) return;
  draft.pick = pick; draft.leaders = nextLeaders;

}

// 画像は長い辺 1024px に縮めて保存(ブラウザの保存容量を圧迫しないように)。切り抜きはあとで調整できる
function takeImageFile(file) {
  if (!file || !file.type.startsWith('image/')) { $('st-msg').textContent = '画像ファイルを選んでください'; return; }
  const url = URL.createObjectURL(file);
  const im = new Image();
  im.onload = () => {
    const k = Math.min(1, 1024 / Math.max(im.width, im.height));
    const c = makeCanvas(Math.round(im.width * k), Math.round(im.height * k));
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    // 透過のある画像は PNG で保存(JPEG にすると透明な所が黒くなり、背景色が効かない)
    const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    let alpha = false;
    for (let k = 3; k < d.length; k += 16) if (d[k] < 250) { alpha = true; break; }
    setImage(alpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.88));
  };
  im.onerror = () => { $('st-msg').textContent = 'この画像は読み込めませんでした'; };
  im.src = url;
}

// OBS の「対話(操作)」窓から届くキーは e.code が空のことがあるので、e.key / keyCode でも判定する
function keyName(e) {
  if (e.code) return e.code;
  const byKey = { ' ': 'Space', Spacebar: 'Space', Enter: 'Enter', Escape: 'Escape', Esc: 'Escape', h: 'KeyH', H: 'KeyH', s: 'KeyS', S: 'KeyS' };
  const byCode = { 32: 'Space', 13: 'Enter', 27: 'Escape', 72: 'KeyH', 83: 'KeyS' };
  return byKey[e.key] || byCode[e.keyCode] || '';
}
window.addEventListener('keydown_disabled', (e) => {
  if (!$('settings').classList.contains('hidden')) { if (keyName(e) === 'Escape') closeSettings(); return; }
  const k = keyName(e);
  if (k === 'Space' || k === 'Enter' || k === 'NumpadEnter') {
    e.preventDefault();
    if (e.repeat) return;
    if (pushResolve) pushResolve();
    else if ($('result').classList.contains('show')) closeResult();
    else startSpin();
  } else if (k === 'Escape') closeResult();
  else if (k === 'KeyS') openSettings();
  else if (k === 'KeyH') document.body.classList.toggle('ui-hidden');
});

    e.target.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY }));

  lastTouchEnd = now;
}, { passive: false });
